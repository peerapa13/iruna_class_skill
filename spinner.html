<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://iruna-online.com/img/fankit/Colon_orange.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงล้อสุ่มอาชีพ - Iruna Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4a843;
            --gold-light: #f0c96a;
            --accent: #3fc8f9;
            --deep: #0a0812;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #e8e0f0;
            --text-dim: #9d8fb8;
            --sidebar-w: 230px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--deep);
            color: var(--text);
            font-family: 'Noto Sans Thai', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        #stars {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(ellipse at 50% 50%, rgba(124,58,237,0.1) 0%, transparent 80%);
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
            z-index: 2;
        }

        .title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 32px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .container {
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(212, 168, 67, 0.4);
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 400px;
            width: auto;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
        }

        #wheel-container {
            position: relative;
            margin: 20px 0;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 320px;
            max-height: 320px;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid var(--accent);
            z-index: 10;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .spin-btn {
            margin-top: 25px;
            padding: 15px 60px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: none;
            border-radius: 50px;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(212, 168, 67, 0.4);
            z-index: 2;
            position: relative;
            width: 80%;
            max-width: 250px;
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            z-index: 2;
            position: relative;
            margin-top: 20px;
            font-size: 24px;
            color: var(--accent);
            min-height: 36px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(63, 200, 249, 0.3);
        }

        .back-link {
            margin-top: 40px;
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .back-link:hover {
            border-bottom: 1px solid var(--gold);
        }

        .hamburger-btn {
            position: fixed; top: 14px; left: 14px; z-index: 1001;
            width: 42px; height: 42px;
            background: rgba(10,8,18,0.9); border: 1px solid rgba(212,168,67,0.35);
            border-radius: 8px; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
            transition: border-color .2s, background .2s;
            backdrop-filter: blur(8px);
        }
        .hamburger-btn:hover { border-color: var(--gold); background: rgba(212,168,67,0.08); }
        .hamburger-btn span {
            display: block; width: 18px; height: 2px;
            background: var(--gold); border-radius: 2px;
            transition: transform .3s, opacity .3s;
        }
        .sidebar-open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .sidebar-open .hamburger-btn span:nth-child(2) { opacity: 0; }
        .sidebar-open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .sb-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
            opacity: 0; pointer-events: none; transition: opacity .3s;
        }
        .sidebar-open .sb-overlay { opacity: 1; pointer-events: all; }
        .sidebar {
            position: fixed; top: 0; left: 0; z-index: 1000;
            width: var(--sidebar-w); height: 100vh;
            background: #0d0f14; border-right: 1px solid rgba(212,168,67,0.2);
            display: flex; flex-direction: column; gap: 5px;
            padding: 70px 12px 40px; overflow-y: auto;
            transform: translateX(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
        }
        .sidebar-open .sidebar { transform: translateX(0); }
        .sidebar-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 10px; color: var(--gold);
            letter-spacing: 2px; text-transform: uppercase;
            padding-bottom: 10px; margin-bottom: 6px;
            border-bottom: 1px solid rgba(212,168,67,0.25);
        }
        .sb-btn {
            display: block; width: 100%; text-align: left;
            padding: 9px 12px;
            background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.6);
            border-radius: 6px; color: var(--text-dim);
            font-family: 'Noto Sans Thai', sans-serif; font-size: 13px;
            cursor: pointer; text-decoration: none;
            transition: all .2s;
        }
        .sb-btn:hover  { background: rgba(63,200,249,0.08); border-color: var(--accent); color: var(--accent); }
        .sb-btn.active { background: rgba(212,168,67,0.1);  border-color: var(--gold);   color: var(--gold-light); }
        .sb-group-header {
            width: 100%; text-align: left;
            padding: 9px 12px;
            background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.22);
            border-radius: 6px; color: var(--gold);
            font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background .2s;
        }
        .sb-group-header:hover { background: rgba(212,168,67,0.15); }
        .sb-arrow { font-size: 9px; transition: transform .25s; }
        .sb-group.open .sb-arrow { transform: rotate(180deg); }
        .sb-group-content {
            display: none; flex-direction: column; gap: 4px;
            padding-left: 10px; margin-top: 4px;
            border-left: 1px solid rgba(63,200,249,0.25);
        }
        .sb-group.open .sb-group-content { display: flex; }
        .sb-sub-label {
            font-size: 10px; color: var(--accent);
            letter-spacing: 1px; text-transform: uppercase;
            padding: 6px 6px 2px;
        }
        .sb-section-label {
            margin-top: 10px; font-size: 11px; color: var(--gold);
            letter-spacing: 1px; padding: 6px 0 4px;
            border-bottom: 1px solid rgba(212,168,67,0.2);
        }

        @media (max-width: 375px) {
            #wheel-container {
                width: 280px;
                height: 280px;
            }
            .pointer {
                border-left: 15px solid transparent;
                border-right: 15px solid transparent;
                border-top: 25px solid var(--accent);
                top: -15px;
            }
            .spin-btn {
                padding: 12px 40px;
                font-size: 18px;
            }
        }

        /* ===== Modal Style ===== */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 8, 18, 0.85); 
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.show {
            display: flex;
            opacity: 1;
        }
        
        .modal-content {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            padding: 35px 25px;
            border: 2px solid var(--gold);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 50px rgba(212, 168, 67, 0.4);
            text-align: center;
            position: relative;
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-close {
            color: var(--text-dim);
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--gold);
        }

        .modal-header h2 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 24px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .modal-body {
            margin: 25px 0;
        }

        .modal-body p {
            color: var(--text-dim);
            font-size: 16px;
            margin-bottom: 10px;
        }

        .modal-body h1 {
            font-size: 36px;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(63, 200, 249, 0.5);
            font-weight: bold;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(63, 200, 249, 0.4); }
            100% { transform: scale(1.05); text-shadow: 0 0 20px rgba(63, 200, 249, 0.8); }
        }

        .modal-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-btn {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border: none;
            border-radius: 25px;
            color: #000;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 168, 67, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--gold);
        }

        .modal-btn.outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            box-shadow: 0 5px 15px rgba(63, 200, 249, 0.15);
        }

        .modal-btn.outline:hover {
            background: rgba(63, 200, 249, 0.1);
            box-shadow: 0 0 15px var(--accent);
        }
    </style>
</head>
<body>
    <div id="sb-root"></div>
    <script>
        fetch('sidebar.html')
            .then(r => r.text())
            .then(html => {
                const root = document.getElementById('sb-root');
                root.innerHTML = html;
                root.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
            })
            .catch(() => console.warn('ไม่สามารถโหลด sidebar.html ได้'));
    </script>
    <div id="stars"></div>

    <div class="container">
        <div id="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="320" height="320"></canvas>
        </div>
        
        <button id="spinBtn" class="spin-btn">หมุนวงล้อ!</button>
        <div id="result"></div>
    </div>

    <!-- Modal for Result -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2>🎉 ยินดีด้วย! 🎉</h2>
            </div>
            <div class="modal-body">
                <p>คุณสุ่มได้อาชีพ</p>
                <h1 id="modalResultText"></h1>
            </div>
            <div class="modal-footer">
                <a id="viewSkillsBtn" href="#" class="modal-btn outline">ดูรายละเอียดสกิล</a>
                <button id="modalCloseBtn" class="modal-btn">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        const jobs = [
            "พาลาดิน", "จอมดาบ", "บีทไนท์", "นักแม่นธนู", 
            "นักฆ่า", "ซัมมอนเนอร์", "จอมขมังเวทย์", "เนโครแมนเซอร์", 
            "ผู้วิเศษ", "สังฆราช", "นักพรต", "เซอร์แวน", 
            "นินจา", "ซามุไร", "นักดนตรี", "นักเล่นแร่แปรธาตุ"
        ];

        const jobKeys = {
            "พาลาดิน": "paladin",
            "จอมดาบ": "gladiator",
            "บีทไนท์": "beastknight",
            "นักแม่นธนู": "sniper",
            "นักฆ่า": "assassin",
            "ซัมมอนเนอร์": "summoner",
            "จอมขมังเวทย์": "highwizard",
            "เนโครแมนเซอร์": "necromancer",
            "ผู้วิเศษ": "enchanter",
            "สังฆราช": "bishop",
            "นักพรต": "monk",
            "เซอร์แวน": "servant",
            "นินจา": "ninja",
            "ซามุไร": "samurai",
            "นักดนตรี": "minstrel",
            "นักเล่นแร่แปรธาตุ": "alchemist"
        };

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const resultDiv = document.getElementById("result");

        const modal = document.getElementById("resultModal");
        const modalResultText = document.getElementById("modalResultText");
        const modalCloseBtn = document.getElementById("modalCloseBtn");
        const modalCloseSpan = document.querySelector(".modal-close");
        const viewSkillsBtn = document.getElementById("viewSkillsBtn");

        let currentAngle = 0;
        const numSegments = jobs.length;
        const arcSize = (2 * Math.PI) / numSegments;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + (i * arcSize);
                
                ctx.fillStyle = (i % 2 === 0) ? "#1e293b" : "#0f172a";
                ctx.strokeStyle = "#d4a843";
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#e8e0f0";
                ctx.font = "bold 10px 'Noto Sans Thai'";
                ctx.fillText(jobs[i], radius - 15, 5);
                ctx.restore();
            }
        }

        function spin() {
            spinBtn.disabled = true;
            resultDiv.innerText = "กำลังสุ่ม...";
            
            const extraSpins = Math.floor(Math.random() * 5) + 5;
            const randomAngle = Math.random() * (2 * Math.PI);
            const totalRotation = (extraSpins * 2 * Math.PI) + randomAngle;
            
            const duration = 4000;
            const start = performance.now();
            const initialAngle = currentAngle;

            function animate(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = initialAngle + (totalRotation * easeOut);
                
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    finishSpin();
                }
            }

            requestAnimationFrame(animate);
        }

        function showModal(jobName) {
            modalResultText.innerText = jobName;
            
            // Set up link to job.html
            const key = jobKeys[jobName];
            if (key) {
                viewSkillsBtn.href = `job.html?job=${key}`;
                viewSkillsBtn.style.display = "inline-flex";
            } else {
                viewSkillsBtn.style.display = "none";
            }

            modal.style.display = "flex";
            // force reflow
            modal.offsetHeight;
            modal.classList.add("show");
        }

        function hideModal() {
            modal.classList.remove("show");
            setTimeout(() => {
                modal.style.display = "none";
            }, 300);
        }

        function finishSpin() {
            spinBtn.disabled = false;
            
            const normalizedAngle = (currentAngle % (2 * Math.PI));
            const pointerAngle = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
            const finalPointerAngle = pointerAngle < 0 ? pointerAngle + 2 * Math.PI : pointerAngle;
            
            const winningIndex = Math.floor(finalPointerAngle / arcSize);
            const winningJob = jobs[winningIndex];
            
            resultDiv.innerText = "ผลลัพธ์ของคุณคือ: " + winningJob;
            showModal(winningJob);
        }

        modalCloseBtn.addEventListener("click", hideModal);
        modalCloseSpan.addEventListener("click", hideModal);
        window.addEventListener("click", (event) => {
            if (event.target === modal) {
                hideModal();
            }
        });

        spinBtn.addEventListener("click", spin);

        drawWheel();
    </script>
</body>
</html>
