<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://iruna-online.com/img/fankit/Colon_orange.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิธีทำสกิล | Iruna Online</title>
<meta name="description" content="รายละเอียดวิธีทำสกิล Iruna Online ภาษาไทย">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a843; --gold-light: #f0c96a; --accent: #3fc8f9;
    --deep: #0a0812; --text: #e8e0f0; --text-dim: #9d8fb8;
    --sidebar-width: 260px;
    --card-bg: rgba(20,28,46,0.85);
    --card-border: rgba(51,65,85,0.7);
    --quest-color: #ffc850;
    --drop-color: #64dc96;
    --shop-color: #b482ff;
    --kill-color: #ff6b6b;
    --collect-color: #64dc96;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep); color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif; font-size: 15px; line-height: 1.65;
    min-height: 100vh;
  }
  #stars {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.12) 0%, transparent 60%);
  }

 /* ── Sidebar (unchanged) ── */
  .hamburger-btn { position: fixed; top: 14px; left: 14px; z-index: 1001; width: 42px; height: 42px; background: rgba(10,8,18,0.9); border: 1px solid rgba(212,168,67,0.35); border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; transition: border-color .2s, background .2s; backdrop-filter: blur(8px); }
  .hamburger-btn:hover { border-color: var(--gold); background: rgba(212,168,67,0.08); }
  .hamburger-btn span { display: block; width: 18px; height: 2px; background: var(--gold); border-radius: 2px; transition: transform .3s, opacity .3s; }
  .sidebar-open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .sidebar-open .hamburger-btn span:nth-child(2) { opacity: 0; }
  .sidebar-open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .sb-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sidebar-open .sb-overlay { opacity: 1; pointer-events: all; }
  .sidebar { position: fixed; top: 0; left: 0; z-index: 1000; width: var(--sidebar-width); height: 100vh; background: rgba(12,10,22,0.97); border-right: 1px solid rgba(212,168,67,0.2); display: flex; flex-direction: column; gap: 5px; padding: 70px 12px 40px; overflow-y: auto; transform: translateX(calc(-1 * var(--sidebar-width))); transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: none; }
  .sidebar-open .sidebar { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,0,0,0.6); }
  .sidebar-title { font-family: 'Cinzel Decorative', serif; font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid rgba(212,168,67,0.25); }
  .sb-btn { display: block; width: 100%; text-align: left; padding: 9px 12px; background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.6); border-radius: 6px; color: var(--text-dim); font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; cursor: pointer; text-decoration: none; transition: all .2s; }
  .sb-btn:hover { background: rgba(63,200,249,0.08); border-color: var(--accent); color: var(--accent); }
  .sb-btn.active { background: rgba(212,168,67,0.1); border-color: var(--gold); color: var(--gold-light); }
  .sb-section-label { margin-top: 10px; font-size: 11px; color: var(--gold); letter-spacing: 1px; padding: 6px 0 4px; border-bottom: 1px solid rgba(212,168,67,0.2); }

  /* ── Hero ── */
  .hero {
    text-align: center; padding: 52px 20px 24px; position: relative; z-index: 1;
  }
  .hero-eyebrow {
    font-size: 11px; letter-spacing: 2px; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(18px, 4.5vw, 26px);
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px;
  }

  /* ── Level info strip ── */
  .lv-strip {
    display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-top: 6px;
  }
  .lv-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
    border: 1px solid;
  }
  .lv-pill.skill { color: var(--gold-light); border-color: rgba(212,168,67,0.4); background: rgba(212,168,67,0.1); }
  .lv-pill.char  { color: var(--accent);     border-color: rgba(63,200,249,0.35);  background: rgba(63,200,249,0.07); }
  .lv-pill.quest { color: var(--quest-color);border-color: rgba(255,200,80,0.35);  background: rgba(255,200,80,0.07); }
  .lv-pill.drop  { color: var(--drop-color); border-color: rgba(100,220,150,0.35); background: rgba(100,220,150,0.07); }
  .lv-pill.shop  { color: var(--shop-color); border-color: rgba(180,130,255,0.35); background: rgba(180,130,255,0.07); }
  .lv-divider { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.18); }

  /* ── Main ── */
  .main-wrapper {
    position: relative; z-index: 1;
    max-width: 680px; margin: 0 auto; padding: 0 16px 80px;
  }

  /* ── Back button ── */
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; margin-bottom: 22px;
    background: rgba(212,168,67,0.07); border: 1px solid rgba(212,168,67,0.25);
    border-radius: 8px; color: var(--gold); text-decoration: none; font-size: 13px;
    transition: all .2s; cursor: pointer;
  }
  .back-btn:hover { background: rgba(212,168,67,0.14); border-color: var(--gold); }

  /* ── Obtain card ── */
  .obtain-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 0; overflow: hidden;
    margin-bottom: 14px;
  }
  .obtain-card.quest { border-left: 3px solid var(--quest-color); }
  .obtain-card.drop  { border-left: 3px solid var(--drop-color);  }
  .obtain-card.shop  { border-left: 3px solid var(--shop-color);  }

  /* card header bar */
  .obtain-card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .obtain-card-header .header-icon { font-size: 18px; }
  .obtain-card-header .header-title {
    font-size: 14px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
  }
  .obtain-card-header .header-title.quest { color: var(--quest-color); }
  .obtain-card-header .header-title.drop  { color: var(--drop-color);  }
  .obtain-card-header .header-title.shop  { color: var(--shop-color);  }

  /* ── Timeline steps ── */
  .timeline { padding: 18px 20px 20px; display: flex; flex-direction: column; }

  .tl-step {
    display: flex; gap: 14px; align-items: flex-start;
    position: relative;
  }

  /* vertical line connecting steps */
  .tl-step:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 15px; top: 32px;
    width: 2px; bottom: -12px;
    background: rgba(255,255,255,0.08);
    border-radius: 1px;
  }
  .tl-step + .tl-step { margin-top: 12px; }

  /* circle number */
  .tl-num {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; z-index: 1;
  }
  .tl-num.quest { background: rgba(255,200,80,0.15);  color: var(--quest-color); border: 1.5px solid rgba(255,200,80,0.4); }
  .tl-num.drop  { background: rgba(100,220,150,0.15); color: var(--drop-color);  border: 1.5px solid rgba(100,220,150,0.4); }
  .tl-num.shop  { background: rgba(180,130,255,0.15); color: var(--shop-color);  border: 1.5px solid rgba(180,130,255,0.4); }

  .tl-body {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 12px 14px;
    transition: background .15s;
  }
  .tl-body:hover { background: rgba(255,255,255,0.04); }

  .tl-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 5px; opacity: .65;
  }
  .tl-label.quest { color: var(--quest-color); }
  .tl-label.drop  { color: var(--drop-color);  }
  .tl-label.shop  { color: var(--shop-color);  }

  .tl-main { font-size: 14px; color: var(--text); line-height: 1.55; font-weight: 500; }
  .tl-sub  { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

  /* ── Photo placeholder ── */
  .photo-slot {
    margin-top: 10px; border-radius: 8px; overflow: hidden;
    border: 1px dashed rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.02);
    min-height: 56px; display: flex; align-items: center; justify-content: center;
  }
  .photo-slot img { width: 100%; display: block; border-radius: 8px; }
  .photo-slot-empty {
    font-size: 11px; color: rgba(255,255,255,0.2);
    padding: 12px 16px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Task chips (เก็บของ=เขียว, ตีมอน=แดง) ── */
  .task-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .task-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 7px; font-size: 13px;
  }
  .task-item.collect {
    color: var(--collect-color); background: rgba(100,220,150,0.07);
    border: 1px solid rgba(100,220,150,0.2);
  }
  .task-item.kill {
    color: var(--kill-color); background: rgba(255,107,107,0.07);
    border: 1px solid rgba(255,107,107,0.2);
  }
  .task-item .task-icon { font-size: 14px; flex-shrink: 0; }
  .task-placeholder {
    font-size: 12px; color: rgba(255,255,255,0.2);
    padding: 6px 10px; border-radius: 7px;
    border: 1px dashed rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── NPC chip ── */
  .npc-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    background: rgba(63,200,249,0.08); border: 1px solid rgba(63,200,249,0.22);
    border-radius: 6px; padding: 2px 9px; cursor: pointer; white-space: nowrap;
    transition: background .15s;
  }
  .npc-chip:hover { background: rgba(63,200,249,0.16); }

  /* ── Item chip ── */
  .item-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; border-radius: 7px; padding: 3px 10px;
  }
  .item-chip.drop { color: var(--drop-color); background: rgba(100,220,150,0.08); border: 1px solid rgba(100,220,150,0.25); }
  .item-chip.shop { color: var(--shop-color); background: rgba(180,130,255,0.08); border: 1px solid rgba(180,130,255,0.25); }

  /* ── Reward step special style ── */
  .reward-body {
    background: rgba(212,168,67,0.06); border: 1px solid rgba(212,168,67,0.18);
  }
  .reward-body .tl-main { color: var(--gold-light); font-weight: 700; }

  /* ── Empty / loading ── */
  .state-box { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 14px; }
  .state-box .icon { font-size: 40px; margin-bottom: 12px; }
  .state-box h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }

  /* ── NPC popup ── */
  .npc-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; }
  .npc-overlay.open { display: flex; }
  .npc-popup { background: rgba(12,10,22,0.97); border: 1px solid rgba(212,168,67,0.3); border-radius: 14px; padding: 20px 22px; max-width: 400px; width: 92%; }
  .npc-popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .npc-popup-title { font-size: 15px; font-weight: 700; color: var(--gold-light); }
  .npc-popup-close { background: none; border: none; cursor: pointer; color: var(--text-dim); font-size: 20px; padding: 2px 6px; border-radius: 6px; transition: color .2s; }
  .npc-popup-close:hover { color: var(--text); }
  .npc-popup-img-wrap { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; min-height: 140px; display: flex; align-items: center; justify-content: center; }
  .npc-popup-img-wrap img { width: 100%; display: block; border-radius: 10px; }
  .npc-popup-loading { font-size: 13px; color: var(--text-dim); padding: 2rem; text-align: center; }
  .npc-popup-error { font-size: 13px; color: #ff8080; padding: 1.5rem; text-align: center; }
  .npc-popup-info { margin-top: 10px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }

  @media (max-width: 600px) {
    .tl-body { padding: 10px 12px; }
    .obtain-card-header { padding: 12px 14px 10px; }
    .timeline { padding: 14px 14px 16px; }
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="sb-root"></div>
<script>
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      const root = document.getElementById('sb-root');
      root.innerHTML = html;
      root.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns);
      });
    })
    .catch(() => {});
</script>

<div class="hero">
  <div class="hero-eyebrow">วิธีทำสกิล</div>
  <h1 class="hero-title" id="page-title">รับสกิล</h1>
  <div class="lv-strip" id="lv-strip"></div>
</div>

<div class="main-wrapper">
  <div id="view-port">
    <div class="state-box"><div class="icon">⏳</div><h3>กำลังโหลดข้อมูล...</h3></div>
  </div>
</div>

<!-- NPC Popup -->
<div class="npc-overlay" id="npcOverlay" onclick="if(event.target===this)closeNpcPopup()">
  <div class="npc-popup" onclick="event.stopPropagation()">
    <div class="npc-popup-header">
      <span class="npc-popup-title" id="npcPopupTitle">ที่อยู่ NPC</span>
      <button class="npc-popup-close" onclick="closeNpcPopup()">✕</button>
    </div>
    <div class="npc-popup-img-wrap" id="npcPopupImgWrap">
      <div class="npc-popup-loading">⏳ กำลังโหลด...</div>
    </div>
    <div class="npc-popup-info" id="npcPopupInfo"></div>
  </div>
</div>

<script>
const SKILLS_DATA_PATH  = './data/skills.json';
const NPC_BASE          = './data/npc/';
const OBTAIN_QUEST_PATH = './data/obtain/quest/';
const OBTAIN_DROP_PATH  = './data/obtain/drop/';
const OBTAIN_SHOP_PATH  = './data/obtain/shop/';
let NPC_ID_MAP = {};
fetch('./NPC/npc_id_map.json').then(r => r.json()).then(d => { NPC_ID_MAP = d; }).catch(() => {});

/* ── NPC Popup ── */
async function showNpcPopup(npcId, label) {
  document.getElementById('npcPopupTitle').textContent = label;
  document.getElementById('npcPopupInfo').textContent = '';
  const wrap = document.getElementById('npcPopupImgWrap');
  wrap.innerHTML = '<div class="npc-popup-loading">⏳ กำลังโหลด...</div>';
  document.getElementById('npcOverlay').classList.add('open');
  try {
    const res = await fetch(NPC_BASE + npcId + '.json');
    if (!res.ok) throw new Error();
    const data = await res.json();
    wrap.innerHTML = data.image
      ? `<img src="${data.image}" alt="${label}">`
      : '<div class="npc-popup-loading" style="color:var(--text-dim)">ไม่มีรูปภาพ</div>';
    let info = '';
    if (data.location) info += '📍 ' + data.location;
    if (data.desc) info += (info ? '\n' : '') + data.desc;
    document.getElementById('npcPopupInfo').textContent = info;
  } catch {
    wrap.innerHTML = `<div class="npc-popup-error">⚠ ยังไม่มีข้อมูล NPC นี้<br><small style="opacity:.6">${npcId}.json</small></div>`;
  }
}
function closeNpcPopup() { document.getElementById('npcOverlay').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNpcPopup(); });

/* ── NPC chip ── */
function npcChip(npcName) {
  if (!npcName) return `<span style="color:var(--text-dim)">–</span>`;
  const npcId = NPC_ID_MAP[npcName];
  if (npcId) {
    return `<span class="npc-chip" onclick="showNpcPopup('${npcId}','${npcName.replace(/'/g,"\\'")}')">👤 ${npcName}</span>`;
  }
  return `<span style="color:var(--accent);font-weight:600;">👤 ${npcName}</span>`;
}

/* ── Photo placeholder ── */
function photoSlot(imgSrc) {
  if (imgSrc) {
    return `<div class="photo-slot"><img src="${imgSrc}" alt=""></div>`;
  }
  return `<div class="photo-slot">
    <div class="photo-slot-empty">🖼 รูปภาพประกอบ (เร็วๆ นี้)</div>
  </div>`;
}

/* ── Build a single timeline step ── */
function tlStep(num, colorClass, label, mainHTML, subHTML, imgSrc, extraHTML, isReward) {
  const rewardClass = isReward ? ' reward-body' : '';
  return `
    <div class="tl-step">
      <div class="tl-num ${colorClass}">${num}</div>
      <div class="tl-body${rewardClass}">
        <div class="tl-label ${colorClass}">${label}</div>
        <div class="tl-main">${mainHTML}</div>
        ${subHTML ? `<div class="tl-sub">${subHTML}</div>` : ''}
        ${extraHTML || ''}
        ${imgSrc !== undefined ? photoSlot(imgSrc) : ''}
      </div>
    </div>
  `;
}

/* ── Build quest section from JSON data ── */
function buildQuestSection(data, lvChar, lvNum) {
  const cc = 'quest';
  let stepNum = 1;
  let steps = '';

  /* Step 1: รับเควสจาก NPC */
  const npcHTML   = npcChip(data.npcName);
  const locSubTxt = data.location ? `📍 ${data.location}` : null;
  steps += tlStep(stepNum++, cc,
    'รับเควสจาก NPC',
    data.questName
      ? `📜 <strong>${data.questName}</strong>`
      : 'รอการอัปเดต',
    locSubTxt ? `${npcHTML} &nbsp;·&nbsp; ${locSubTxt}` : npcHTML,
    data.photo || null
  );

  /* Step 2: สิ่งที่ต้องทำ */
  let taskHTML = '';
  if (data.conditions && data.conditions.length > 0) {
    taskHTML = `<div class="task-list">` +
      data.conditions.map(c =>
        `<div class="task-item ${c.type}">
          <span class="task-icon">${c.icon || (c.type === 'kill' ? '⚔' : '')}</span>
          <span>${c.text}</span>
        </div>`
      ).join('') +
      `</div>`;
  } else {
    taskHTML = `<div class="task-list"><div class="task-placeholder">⚙ ข้อมูลเงื่อนไขเควสจะถูกเพิ่มในอนาคต</div></div>`;
  }
  steps += tlStep(stepNum++, cc,
    'สิ่งที่ต้องทำ',
    'ทำตามเงื่อนไขเควส',
    null, null, taskHTML
  );

  /* Step 3: ส่งเควส */
  const submitNpc      = data.submitNpc      || data.npcName;
  const submitLocation = data.submitLocation || data.location;
  steps += tlStep(stepNum++, cc,
    'ส่งเควส',
    submitNpc ? npcChip(submitNpc) : 'ส่งเควสกับ NPC ที่รับมา',
    submitLocation ? ` ${submitLocation}` : null,
    null
  );

  /* Step 4: รับสกิล */
  steps += tlStep(stepNum++, cc,
    'รับสกิล',
    `✦ สกิลเลเวล ${lvChar}`,
    `ต้องการตัวละคร Lv.${lvNum}`,
    undefined, null, true
  );

  return `
    <div class="obtain-card quest">
      <div class="obtain-card-header">
        <span class="header-icon">📜</span>
        <span class="header-title quest">วิธีทำสกิล — เควส</span>
      </div>
      <div class="timeline">${steps}</div>
    </div>
  `;
}

/* ── Build drop section from JSON data ── */
function buildDropSection(data, lvChar, lvNum) {
  const cc = 'drop';
  let stepNum = 1;
  let steps = '';

  /* Step 1: ล่ามอนสเตอร์ */
  const monsterSub = [
    data.location ? `📍 ${data.location}` : null,
    data.dropRate  ? `อัตราดรอป: ${data.dropRate}` : null,
  ].filter(Boolean).join(' &nbsp;·&nbsp; ') || null;

  steps += tlStep(stepNum++, cc,
    'ล่ามอนสเตอร์',
    data.monster ? ` <strong>${data.monster}</strong>` : 'มอนสเตอร์ที่ดรอปไอเทม',
    monsterSub,
    data.photo || null
  );

  /* Step 2: เก็บไอเทมดรอป */
  steps += tlStep(stepNum++, cc,
    'เก็บไอเทมที่ดรอป',
    data.itemName
      ? `<span class="item-chip drop">🗡 ${data.itemName}</span>`
      : 'ไอเทมสกิล',
    'ไอเทมดรอปจากมอนสเตอร์',
    null
  );

  /* Step 3: ใช้ไอเทม */
  steps += tlStep(stepNum++, cc,
    'ใช้ไอเทมเพื่อเรียนสกิล',
    'ดับเบิ้ลคลิกไอเทมในกระเป๋า',
    null, undefined, null, false
  );

  /* Step 4: รับสกิล */
  steps += tlStep(stepNum++, cc,
    'รับสกิล',
    `✦ สกิลเลเวล ${lvChar}`,
    `ต้องการตัวละคร Lv.${lvNum}`,
    undefined, null, true
  );

  return `
    <div class="obtain-card drop">
      <div class="obtain-card-header">
        <span class="header-icon">💎</span>
        <span class="header-title drop">วิธีทำสกิล — ไอเทมดรอป</span>
      </div>
      <div class="timeline">${steps}</div>
    </div>
  `;
}

/* ── Build shop section from JSON data ── */
function buildShopSection(data, lvChar, lvNum) {
  const cc = 'shop';
  let stepNum = 1;
  let steps = '';

  /* Step 1: ซื้อไอเทม */
  const shopSub = [
    data.location ? `📍 ${data.location}` : null,
    data.price    ? `ราคา: ${data.price}` : null,
    data.note     ? `⚠ ${data.note}`      : null,
  ].filter(Boolean).join(' &nbsp;·&nbsp; ') || null;

  steps += tlStep(stepNum++, cc,
    'ซื้อไอเทมสกิล',
    data.shopName
      ? `<span class="item-chip shop">🛒 ${data.shopName}</span>`
      : `<span class="item-chip shop">🛒 ซื้อจากร้านค้าในเกม</span>`,
    shopSub,
    data.photo || null
  );

  /* Step 2: ใช้ไอเทม */
  steps += tlStep(stepNum++, cc,
    'ใช้ไอเทมเพื่อเรียนสกิล',
    'ดับเบิ้ลคลิกไอเทมในกระเป๋า',
    null, undefined, null, false
  );

  /* Step 3: รับสกิล */
  steps += tlStep(stepNum++, cc,
    'รับสกิล ',
    `✦ สกิลเลเวล ${lvChar}`,
    `ต้องการตัวละคร Lv.${lvNum}`,
    undefined, null, true
  );

  return `
    <div class="obtain-card shop">
      <div class="obtain-card-header">
        <span class="header-icon">🛒</span>
        <span class="header-title shop">วิธีทำสกิล — ซื้อร้านค้า</span>
      </div>
      <div class="timeline">${steps}</div>
    </div>
  `;
}

/* ── Main render ── */
async function renderObtainPage() {
  const params  = new URLSearchParams(location.search);
  const type    = params.get('type')  || '';
  const skillId = params.get('skill') || '';
  const lvChar  = params.get('lv')    || '?';
  const lvNum   = params.get('clv')   || '?';

  const vp = document.getElementById('view-port');

  const colorClass = type === 'เควส'            ? 'quest'
                   : type === 'ไอเทมดรอป'        ? 'drop'
                   : type === 'ไอเทมซื้อร้านค้า' ? 'shop'
                   : 'quest';

  /* ── Hero: ดึงชื่อสกิลจาก skills.json ── */
  let skillName = 'สกิล';
  try {
    const r = await fetch(SKILLS_DATA_PATH);
    if (r.ok) {
      const master = await r.json();
      if (master[skillId] && master[skillId].name) skillName = master[skillId].name;
    }
  } catch(e) {}

  document.getElementById('page-title').textContent = skillName;
  document.getElementById('lv-strip').innerHTML = `
    <span class="lv-pill skill">⚔ สกิล Lv.${lvChar}</span>
    <span class="lv-divider"></span>
    <span class="lv-pill char">👤 ตัวละคร Lv.${lvNum}</span>
    <span class="lv-divider"></span>
    <span class="lv-pill ${colorClass}">${
      colorClass === 'quest' ? '📜 เควส' :
      colorClass === 'drop'  ? '💎 ไอเทมดรอป' : '🛒 ซื้อร้านค้า'
    }</span>
  `;

  /* ── Back btn ── */
  const backBtn = `<a class="back-btn" onclick="history.back()">← กลับหน้าก่อนหน้า</a>`;

  if (!skillId) {
    vp.innerHTML = `${backBtn}<div class="state-box"><div class="icon">🔍</div><h3>ไม่พบ ID สกิล</h3><p>กรุณาเข้าผ่านหน้ารายละเอียดสกิล</p></div>`;
    return;
  }

  /* ── Fetch obtain JSON ── */
  const basePath = colorClass === 'quest' ? OBTAIN_QUEST_PATH
                 : colorClass === 'drop'  ? OBTAIN_DROP_PATH
                 : OBTAIN_SHOP_PATH;

  let section = '';
  try {
    const res = await fetch(`${basePath}${skillId}_${lvChar}.json`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();

    if      (colorClass === 'quest') section = buildQuestSection(data, lvChar, lvNum);
    else if (colorClass === 'drop')  section = buildDropSection(data, lvChar, lvNum);
    else                             section = buildShopSection(data, lvChar, lvNum);
  } catch(e) {
    section = `<div class="state-box">
      <div class="icon">🔍</div>
      <h3>ยังไม่มีข้อมูลรายละเอียด</h3>
      <p>ไฟล์: <code style="opacity:.5;font-size:11px">${basePath}${skillId}.json</code></p>
      <p style="margin-top:6px;font-size:12px;opacity:.5">กรุณารอการอัปเดต</p>
    </div>`;
  }

  vp.innerHTML = `${backBtn}${section}`;
}

document.addEventListener('DOMContentLoaded', renderObtainPage);
</script>
