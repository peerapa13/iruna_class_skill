<!-- sidebar.html — โหลดด้วย JS fetch ในทุกหน้า -->
<!-- Hamburger Button -->
<button class="hamburger-btn" onclick="toggleSidebar()" aria-label="เมนู">
  <span></span><span></span><span></span>
</button>

<!-- Overlay -->
<div class="sb-overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-title">เครื่องมือ</div>

  <a class="sb-btn" href="exp_calculator" data-page="exp_calculator">คำนวณ EXP</a>
  <a class="sb-btn" href="spinner"         data-page="spinner">🎡 สุ่มอาชีพ</a>

  <div class="sb-section-label">ข้อมูลอาชีพ</div>
  <a class="sb-btn sb-job-btn" href="job_tree" data-page="job_tree">เส้นทางอาชีพ</a>
</nav>

<script>
function toggleSidebar() {
  document.body.classList.toggle('sidebar-open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.body.classList.remove('sidebar-open');
});
(function highlightActive() {
  const page = location.pathname.split('/').pop().replace('.html','') || 'index';
  document.querySelectorAll('.sb-btn[data-page]').forEach(btn => {
    if (btn.dataset.page === page) btn.classList.add('active');
  });
})();
</script>
