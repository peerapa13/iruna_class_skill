<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อิลูน่าข้อมูลสกิล</title>
<meta name="description" content="ห้องสมุดข้อมูลสกิลอาชีพ Iruna Online ภาษาไทย">
<meta property="og:title" content="อิลูน่าข้อมูลสกิล">
<meta property="og:description" content="ห้องสมุดข้อมูลสกิลอาชีพ Iruna Online ภาษาไทย">
<meta name="robots" content="index, follow">
  
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f0c96a;
    --accent: #3fc8f9;
    --deep: #0a0812;
    --text: #e8e0f0;
    --text-dim: #9d8fb8;
    --sidebar-width: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif;
  }

  #stars {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.12) 0%, transparent 60%);
  }

  /* ===== Hamburger Button ===== */
  .hamburger-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;
    background: rgba(10, 8, 18, 0.85);
    border: 1px solid rgba(212, 168, 67, 0.4);
    border-radius: 8px;
    color: var(--gold);
    cursor: pointer;
    width: 44px;
    height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }

  .hamburger-btn:hover {
    background: rgba(212, 168, 67, 0.12);
    border-color: var(--gold);
    box-shadow: 0 0 16px rgba(212, 168, 67, 0.2);
  }

  .hamburger-btn .bar {
    width: 20px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
    transform-origin: center;
  }

  /* เมื่อ sidebar เปิด → แถบกลายเป็น X */
  body.sidebar-open .hamburger-btn .bar:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  body.sidebar-open .hamburger-btn .bar:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }
  body.sidebar-open .hamburger-btn .bar:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  /* ===== Overlay ===== */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    z-index: 90;
    pointer-events: none;
    transition: background 0.3s ease;
  }

  body.sidebar-open .sidebar-overlay {
    background: rgba(0, 0, 0, 0.65);
    pointer-events: all;
  }

  /* ===== Sidebar Drawer ===== */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: var(--sidebar-width);
    background: rgba(12, 10, 22, 0.97);
    border-right: 1px solid rgba(212, 168, 67, 0.25);
    z-index: 100;
    transform: translateX(calc(-1 * var(--sidebar-width)));
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 80px 16px 32px;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(212,168,67,0.2) transparent;
  }

  body.sidebar-open .sidebar {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0, 0, 0, 0.6);
  }

  .sidebar h2 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(212, 168, 67, 0.3);
    padding-bottom: 12px;
  }

  .btn-secondary {
    padding: 10px 14px;
    background: rgba(63,200,249,0.08);
    border: 1px solid rgba(63,200,249,0.3);
    color: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
    text-align: left;
    width: 100%;
  }

  .btn-secondary:hover {
    background: rgba(63,200,249,0.18);
    border-color: var(--accent);
  }

  /* ===== Job Groups ===== */
  .job-group {
    margin-bottom: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .group-header {
    background: rgba(212, 168, 67, 0.08);
    color: var(--gold);
    padding: 9px 13px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    border: 1px solid rgba(212, 168, 67, 0.25);
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
  }

  .group-header:hover {
    background: rgba(212, 168, 67, 0.18);
  }

  .group-content {
    display: none;
    padding-left: 10px;
    margin-top: 4px;
    flex-direction: column;
    gap: 4px;
  }

  .job-group.active .group-content {
    display: flex;
  }

  .job-group.active .arrow {
    transform: rotate(180deg);
  }

  .arrow {
    font-size: 10px;
    transition: 0.3s;
  }

  .sub-label {
    color: var(--accent);
    font-size: 11px;
    margin-top: 6px;
    margin-bottom: 2px;
    padding-left: 6px;
    border-left: 2px solid var(--accent);
  }

  .job-btn {
    text-align: left;
    padding: 9px 12px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(51, 65, 85, 0.5);
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
    font-size: 13px;
    font-family: 'Noto Sans Thai', sans-serif;
    width: 100%;
  }

  .job-btn:hover, .job-btn.active {
    background: rgba(63, 200, 249, 0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ===== Main Layout ===== */
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
    z-index: 1;
  }

  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 36px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .hero-desc {
    color: var(--text-dim);
    margin-bottom: 30px;
  }

  .main-wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ===== Cards ===== */
  .card {
    background: rgba(30, 41, 59, 0.8);
    padding: 32px;
    border-radius: 8px;
    border: 1px solid rgba(51, 65, 85, 0.8);
  }

  .job-title {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .job-desc {
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .section-title {
    color: var(--gold);
    font-size: 16px;
    font-weight: 600;
    margin-top: 24px;
    margin-bottom: 10px;
  }

  .info-box {
    background: rgba(15, 23, 42, 0.8);
    padding: 14px;
    border-radius: 6px;
    border-left: 3px solid rgba(63, 200, 249, 0.5);
    color: var(--text-dim);
    line-height: 1.6;
  }

  .req-item {
    padding: 6px 0;
  }

  /* ===== Skills Grid ===== */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .skill-btn {
    padding: 14px;
    background: rgba(30, 41, 59, 0.6);
    border: 2px solid rgba(212, 168, 67, 0.4);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 13px;
    font-weight: 600;
  }

  .skill-btn:hover {
    background: rgba(212, 168, 67, 0.15);
    border-color: var(--gold-light);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(212, 168, 67, 0.2);
  }

  .skill-btn img {
    width: 32px;
    display: block;
    margin: 0 auto 8px;
    border-radius: 4px;
  }

  /* ===== Modal ===== */
  .modal {
    background: rgba(10, 8, 18, 0.95);
    border: 2px solid var(--gold);
    border-radius: 12px;
    color: var(--text);
    padding: 0;
    max-width: 500px;
    max-height: 85vh;
    margin: auto;
    box-shadow: 0 0 30px rgba(212, 168, 67, 0.3);
    overflow: hidden;
  }

  .modal::backdrop {
    background: rgba(0, 0, 0, 0.85);
  }

  .modal-header {
    background: linear-gradient(135deg, rgba(212, 168, 67, 0.15) 0%, rgba(63, 200, 249, 0.1) 100%);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    border-bottom: 1px solid rgba(212, 168, 67, 0.3);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 60px);
  }

  .close-modal {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 24px;
    transition: color 0.2s;
  }

  .close-modal:hover { color: var(--gold); }

  .skill-detail-type {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    background: rgba(63, 200, 249, 0.1);
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-block;
  }

  .skill-detail-desc {
    background: rgba(15, 23, 42, 0.8);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid #77D77B;
    margin-bottom: 16px;
    line-height: 1.6;
    font-size: 13px;
  }

  .skill-lv-tabs { display: flex; flex-direction: column; gap: 8px; }

  .skill-lv-tab {
    padding: 12px 14px;
    background: rgba(212, 168, 67, 0.05);
    border: 1px solid rgba(212, 168, 67, 0.3);
    border-radius: 6px;
    transition: all 0.2s;
  }

  .skill-lv-tab:hover {
    background: rgba(212, 168, 67, 0.15);
    border-color: var(--gold-light);
    color: var(--gold-light);
  }

  .lv-header { font-weight: 600; color: var(--gold-light); margin-bottom: 4px; }
  .lv-location { font-size: 12px; color: var(--text-dim); }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }

  /* ===== Home / Changelog ===== */
  .home-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .version-pill {
    background: rgba(212, 168, 67, 0.1);
    border: 1px solid rgba(212, 168, 67, 0.35);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .version-date {
    color: var(--text-dim);
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 11px;
    font-weight: 400;
    margin-left: 6px;
  }

  .home-two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 700px) {
    .home-two-col { grid-template-columns: 1fr; }
  }

  .home-section {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid rgba(51, 65, 85, 0.6);
  }

  .home-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .upcoming-header { color: var(--accent); }
  .recent-header   { color: #77D77B; }

  .upcoming-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .upcoming-item {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    display: inline-block;
    width: fit-content;
    letter-spacing: 0.3px;
  }

  .status-soon    { background: rgba(63,200,249,0.12); color: var(--accent); border: 1px solid rgba(63,200,249,0.3); }
  .status-wip     { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
  .status-planned { background: rgba(100,116,139,0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }

  .changelog-card {
    background: rgba(30, 41, 59, 0.8);
    padding: 32px;
    border-radius: 8px;
    border: 1px solid rgba(51, 65, 85, 0.8);
  }

  .changelog-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 22px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .changelog-subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .changelog-divider {
    border: none;
    border-top: 1px solid rgba(51, 65, 85, 0.6);
    margin: 28px 0;
  }

  .patch-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .patch-item {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .patch-item-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
    letter-spacing: 0.4px;
  }

  .tag-new    { background: rgba(119, 215, 123, 0.15); color: #77D77B; border: 1px solid rgba(119,215,123,0.3); }
  .tag-fix    { background: rgba(255, 188, 66, 0.15); color: #ffbc42; border: 1px solid rgba(255,188,66,0.3); }
  .tag-update { background: rgba(63, 200, 249, 0.15); color: var(--accent); border: 1px solid rgba(63,200,249,0.3); }
  .tag-wip    { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }
</style>
</head>

<body>
<div id="stars"></div>

<!-- Hamburger Button -->
<button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="เปิดเมนู">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar Drawer -->
<nav class="sidebar" id="sidebar">
  <button class="btn-secondary" onclick="location.href='exp_calculator'; closeSidebar();">📊 คำนวนEXP</button>
  <button class="btn-secondary" onclick="location.href='spinner'; closeSidebar();">🎡 สุ่มอาชีพ</button>

  <h2 style="margin-top: 12px;">เส้นทางอาชีพ</h2>

  <div class="job-group">
    <div class="group-header" onclick="toggleGroup(this)">⚔️ นักรบ <span class="arrow">▼</span></div>
    <div class="group-content">
      <div class="sub-label">อัศวิน</div>
      <button class="job-btn" data-job="Paladin">พาลาดิน</button>
      <button class="job-btn" data-job="Gladiator">จอมดาบ</button>
      <button class="job-btn" data-job="Beast Knight">บีทไนท์</button>
      <div class="sub-label">นายพราน</div>
      <button class="job-btn" data-job="Sniper">นักแม่นธนู</button>
      <button class="job-btn" data-job="Assassin">นักฆ่า</button>
      <button class="job-btn" data-job="Summoner">ซัมมอนเนอร์</button>
    </div>
  </div>

  <div class="job-group">
    <div class="group-header" onclick="toggleGroup(this)">🔮 นักเวทย์ <span class="arrow">▼</span></div>
    <div class="group-content">
      <div class="sub-label">จอมเวทย์</div>
      <button class="job-btn" data-job="High Wizard">จอมขมังเวทย์</button>
      <button class="job-btn" data-job="Necromancer">เนโครแมนเซอร์</button>
      <button class="job-btn" data-job="Enchanter">ผู้วิเศษ</button>
      <div class="sub-label">บาทหลวง</div>
      <button class="job-btn" data-job="Bishop">สังฆราช</button>
      <button class="job-btn" data-job="Monk">นักพรต</button>
      <button class="job-btn" data-job="Servant">เซอร์แวน</button>
    </div>
  </div>

  <div class="job-group">
    <div class="group-header" onclick="toggleGroup(this)">✨ พิเศษ <span class="arrow">▼</span></div>
    <div class="group-content">
      <button class="job-btn" data-job="Ninja">นินจา</button>
      <button class="job-btn" data-job="Samurai">ซามุไร</button>
      <button class="job-btn" data-job="Minstrel">นักดนตรี</button>
      <button class="job-btn" data-job="Alchemist">นักเล่นแร่แปรธาตุ</button>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="hero">
  <h1 class="hero-title">🐺 Iruna Online</h1>
  <p class="hero-desc">ห้องสมุดแห่งอาชีพ | บทความข้อมูลภาษาไทย</p>
</div>

<div class="main-wrapper">
  <div id="view-port"></div>
</div>

<dialog id="skillModal" class="modal">
  <div class="modal-header" id="modalHeader"></div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<script>
  const JOB_DATA_PATH = './data/jobs/';
  const jobFilesMap = {
    'Summoner': 'summoner.json',
    'Paladin': 'paladin.json',
    'Gladiator': 'gladiator.json',
    'Beast Knight': 'beastknight.json',
    'Sniper': 'sniper.json',
    'Assassin': 'assassin.json',
    'High Wizard': 'highwizard.json',
    'Necromancer': 'necromancer.json',
    'Enchanter': 'enchanter.json',
    'Bishop': 'bishop.json',
    'Monk': 'monk.json',
    'Servant': 'servant.json',
    'Ninja': 'ninja.json',
    'Samurai': 'samurai.json',
    'Minstrel': 'minstrel.json',
    'Alchemist': 'alchemist.json'
  };

  // ===== Sidebar Toggle =====
  function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
  }

  function closeSidebar() {
    document.body.classList.remove('sidebar-open');
  }

  // ปิด sidebar เมื่อกด ESC
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSidebar();
  });

  // ===== Accordion =====
  function toggleGroup(element) {
    const group = element.parentElement;
    const allGroups = document.querySelectorAll('.job-group');
    allGroups.forEach(g => {
      if (g !== group) g.classList.remove('active');
    });
    group.classList.toggle('active');
  }

  // ===== Load Job Data =====
  async function loadJobData(jobId) {
    try {
      const fileName = jobFilesMap[jobId];
      if (!fileName) return null;
      const response = await fetch(`${JOB_DATA_PATH}${fileName}`);
      if (!response.ok) return null;
      return await response.json();
    } catch (error) {
      console.error(`เกิดข้อผิดพลาด: ${error}`);
      return null;
    }
  }

  // ===== Changelog Data =====
  const SITE_VERSION_DATE = '18 พ.ค. 2025';

  const RECENT_UPDATES = [
    { tag: 'update', text: 'อัปเดตเมนูให้ใช้ง่ายขึ้น' },
    { tag: 'new',    text: 'เพิ่มหน้าแสดงEXPจากเควส' },
    { tag: 'fix',    text: 'แก้ไขการคำนวนEXP โหมด1,โหมด2' },
    { tag: 'update', text: 'เพิ่มข้อมูลEXP จากเควส EP5' },
    { tag: 'update', text: 'เพิ่มข้อมูลEXP จากเควส EP2 - EP4' },
    { tag: 'new',    text: 'เพิ่มหน้าฟังก์ชันคำนวนEXPจากเควส' },
    { tag: 'new',    text: 'เพิ่มหน้าสุ่มอาชีพ' },
    { tag: 'update', text: 'ปรับปรุงข้อมูลสกิลอาชีพที่มีอยู่ให้ถูกต้องและครบถ้วนมากขึ้น' },
    { tag: 'fix',    text: 'แก้ไขข้อมูลสกิลบางส่วนที่ผิดพลาด' },
  ];

  const UPCOMING = [
    { status: 'wip',     text: 'ข้อมูลEXP จากเควส EP6' },
    { status: 'soon',    text: 'ข้อมูลสกิลอาชีพพาลาดิน' },
    { status: 'planned', text: 'ข้อมูลสกิลอาชีพที่เหลือ (จอมขมังเวทย์, นักดนตรี, สังฆราช ฯลฯ)' },
    { status: 'planned', text: 'หน้าแยกแสดงวิธีทำสกิลอย่างละเอียด' },
    { status: 'planned', text: 'ไกด์ทุกอาชีพ' },
    { status: 'planned', text: 'ระบบคำนวนสเตตัส' },
  ];

  const tagLabel = { new: 'NEW', fix: 'FIX', update: 'UPDATE', wip: 'WIP' };
  const tagClass  = { new: 'tag-new', fix: 'tag-fix', update: 'tag-update', wip: 'tag-wip' };
  const statusLabel = { soon: '🔜 เร็ว ๆ นี้', wip: '🔨 กำลังทำ', planned: '📌 วางแผนไว้' };
  const statusClass = { soon: 'status-soon', wip: 'status-wip', planned: 'status-planned' };

  function renderChangelog() {
    const viewport = document.getElementById('view-port');
    document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));

    const recentHTML = RECENT_UPDATES.map(item => `
      <li class="patch-item">
        <span class="patch-item-tag ${tagClass[item.tag]}">${tagLabel[item.tag]}</span>
        <span>${item.text}</span>
      </li>
    `).join('');

    const upcomingHTML = UPCOMING.map(item => `
      <li class="upcoming-item">
        <span class="status-badge ${statusClass[item.status]}">${statusLabel[item.status]}</span>
        <span>${item.text}</span>
      </li>
    `).join('');

    viewport.innerHTML = `
      <div class="changelog-card">
        <div class="home-header">
          <div>
            <h2 class="changelog-title">ข้อมูลอัพเดตเว็บไซต์</h2>
            <p class="changelog-subtitle">ห้องสมุด Iruna Online ภาษาไทย</p>
          </div>
          <div class="version-pill">${SITE_VERSION_DATE}</div>
        </div>

        <hr class="changelog-divider">

        <div class="home-two-col">
          <div class="home-section">
            <div class="home-section-header upcoming-header">
              <span>กำลังจะมา</span>
              <span class="version-date">soon</span>
            </div>
            <ul class="upcoming-list">${upcomingHTML}</ul>
          </div>

          <div class="home-section">
            <div class="home-section-header recent-header">
              <span>✅ อัปเดตล่าสุด</span>
            </div>
            <ul class="patch-items">${recentHTML}</ul>
          </div>
        </div>

        <hr class="changelog-divider">
        <p style="font-size: 12px; color: var(--text-dim); text-align: center;">
          หากพบปัญหาหรือมีข้อเสนอแนะ สามารถติดต่อได้ที่ 
          <a href="https://discord.gg/SKDeYngNp" target="_blank" style="color: var(--accent); text-decoration: underline;">Discord Server</a> ของเรา
        </p>
      </div>
    `;
  }

  async function renderJob(jobId) {
    const viewport = document.getElementById('view-port');
    viewport.innerHTML = '<div class="card"><div class="loading">⏳ กำลังโหลดข้อมูล...</div></div>';
    
    const job = await loadJobData(jobId);
    if (!job) {
      viewport.innerHTML = '<div class="card"><div class="loading">❌ ไม่สามารถโหลดข้อมูลได้</div></div>';
      return;
    }

    document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`[data-job="${jobId}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    let skillsHTML = '';
    if (job.skills && job.skills.length > 0) {
      skillsHTML = '<div class="skills-grid">' +
        [...job.skills]
        .sort((a, b) => {
          if (!a.image && b.image) return -1;
          if (a.image && !b.image) return 1;
          return 0;
        })
        .map(s => {
          const skillNameEsc = s.name.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillTypeEsc = s.type.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillDescEsc = s.desc.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillLvEsc   = (s.lv || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillLocEsc  = (s.loc || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillImgEsc  = (s.image || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          return `
            <button class="skill-btn" onclick="openSkillDetailModal('${skillNameEsc}', '${skillTypeEsc}', '${skillDescEsc}', '${skillLvEsc}', '${skillLocEsc}', '${skillImgEsc}')">
              ${s.image ? `<img src="${s.image}">` : '🅿️'}
              <span>${s.name}</span>
            </button>
          `;
        }).join('') +
      '</div>';
    }

    viewport.innerHTML = `
      <div class="card">
        <h1 class="job-title">${job.name}</h1>
        <p class="job-desc">${job.desc}</p>
        <div class="section-title">หนทางสู่อาชีพนี้...</div>
        <div class="info-box">${job.obtain}</div>
        ${skillsHTML ? `<div class="section-title">⚔️ ข้อมูลสกิล</div><div>${skillsHTML}</div>` :
          '<div class="section-title">⚔️ สกิล</div><div class="info-box">ยังไม่มีข้อมูลสกิลในฐานข้อมูล</div>'}
        <div class="section-title">✓ คำแนะนำสำหรับอาชีพ</div>
        <div class="info-box">
          ${job.prereq.map(r => `<div class="req-item">• ${r}</div>`).join("")}
        </div>
      </div>
    `;
  }

  function openSkillDetailModal(skillName, skillType, skillDesc, skillLv, skillLoc, skillImage) {
    const modal  = document.getElementById('skillModal');
    const header = document.getElementById('modalHeader');
    const body   = document.getElementById('modalBody');

    const lvArray  = skillLv  ? skillLv.split(',')  : [];
    const locArray = skillLoc ? skillLoc.split(',') : [];

    let lvTabsHTML = '';
    if (lvArray.length > 0) {
      lvTabsHTML = '<div class="skill-lv-tabs">' +
        lvArray.map((lv, idx) => {
          const locInfo = locArray[idx] ? locArray[idx].trim() : 'รอการอัปเดต';
          return `
            <div class="skill-lv-tab">
              <div class="lv-header">📍 Level ${idx + 1}</div>
              <div>เลเวลตัวละคร: <strong>${lv.trim()}</strong></div>
              <div class="lv-location">${locInfo}</div>
            </div>
          `;
        }).join('') +
      '</div>';
    }

    header.innerHTML = `
      <div>
        ${skillImage ? `<img src="${skillImage}" style="width:36px;vertical-align:middle;margin-right:8px;border-radius:4px;">` : ''}
        ${skillName}
      </div>
      <button class="close-modal" onclick="document.getElementById('skillModal').close()">✕</button>
    `;

    body.innerHTML = `
      <div class="skill-detail-type">${skillType}</div>
      <div class="skill-detail-desc">${skillDesc}</div>
      ${lvTabsHTML ? `<div style="margin-bottom: 8px; font-weight: 600; color: var(--gold);">วิธีการรับสกิล</div>${lvTabsHTML}` : ''}
    `;

    modal.showModal();
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.job-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const jobId = this.getAttribute('data-job');
        renderJob(jobId);
        closeSidebar();
      });
    });
    renderChangelog();
  });
</script>
</body>
</html>
