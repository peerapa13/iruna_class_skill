<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f0c96a;
    --accent: #3fc8f9;
    --deep: #0a0812;
    --text: #e8e0f0;
    --text-dim: #9d8fb8;

  }

  body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif;

  #stars {
    position: fixed; inset: 0; z-index: 0;

  /* ===== Sidebar (โหลดจาก sidebar.html — CSS ต้อง match) ===== */
  .hamburger-btn {
    position: fixed; top: 14px; left: 14px; z-index: 1001;
    width: 42px; height: 42px;
    background: rgba(10,8,18,0.9); border: 1px solid rgba(212,168,67,0.35);
    border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    transition: border-color .2s, background .2s; backdrop-filter: blur(8px);
  }
  .hamburger-btn:hover { border-color: var(--gold); background: rgba(212,168,67,0.08); }
  .hamburger-btn span {
    display: block; width: 18px; height: 2px;
    background: var(--gold); border-radius: 2px; transition: transform .3s, opacity .3s;
  }
  .sidebar-open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .sidebar-open .hamburger-btn span:nth-child(2) { opacity: 0; }
  .sidebar-open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .sb-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .sidebar-open .sb-overlay { opacity: 1; pointer-events: all; }

  .sidebar {
    position: fixed; top: 0; left: 0; z-index: 1000;
    width: var(--sidebar-width); height: 100vh;
    background: rgba(12,10,22,0.97); border-right: 1px solid rgba(212,168,67,0.2);
    display: flex; flex-direction: column; gap: 5px;
    padding: 70px 12px 40px; overflow-y: auto;
    transform: translateX(calc(-1 * var(--sidebar-width)));
    transition: transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow: none;
  }
  .sidebar-open .sidebar { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,0,0,0.6); }

  .sidebar-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase;
    padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid rgba(212,168,67,0.25);
  }
  .sb-btn {
    display: block; width: 100%; text-align: left; padding: 9px 12px;
    background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.6);
    border-radius: 6px; color: var(--text-dim);
    font-family: 'Noto Sans Thai', sans-serif; font-size: 13px;
    cursor: pointer; text-decoration: none; transition: all .2s;

  .sb-btn:hover  { background: rgba(63,200,249,0.08); border-color: var(--accent); color: var(--accent); }
  .sb-btn.active { background: rgba(212,168,67,0.1);  border-color: var(--gold);   color: var(--gold-light); }
  .sb-group-header {
    width: 100%; text-align: left; padding: 9px 12px;
    background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.22);
    border-radius: 6px; color: var(--gold);
    font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; font-weight: 700;

  .sb-group-header:hover { background: rgba(212,168,67,0.15); }
  .sb-arrow { font-size: 9px; transition: transform .25s; }

    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;

  /* ===== Cards ===== */
  .card {
    background: rgba(30, 41, 59, 0.8);

    border-radius: 8px;
    border: 1px solid rgba(51, 65, 85, 0.8);

  .job-title {

  .info-box {

  /* ===== Skills Grid ===== */
  .skills-grid {

  .skill-btn {

    background: rgba(212, 168, 67, 0.15);

  .skill-btn img {

  /* ===== Modal ===== */
  .modal {

    border: 2px solid var(--gold);
    border-radius: 12px;
    color: var(--text);
    padding: 0;
    max-width: 500px;
    max-height: 85vh;
    margin: auto;

  .modal::backdrop {

  }

  .modal-header {
    background: linear-gradient(135deg, rgba(212, 168, 67, 0.15) 0%, rgba(63, 200, 249, 0.1) 100%);

    font-family: 'Cinzel', serif;
    border-bottom: 1px solid rgba(212, 168, 67, 0.3);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(85vh - 60px);
  }

  .close-modal {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 24px;
    transition: color 0.2s;
  }

  .close-modal:hover { color: var(--gold); }

  .skill-detail-type {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    background: rgba(63, 200, 249, 0.1);
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-block;
  }

  .skill-detail-desc {
    background: rgba(15, 23, 42, 0.8);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid #77D77B;
    margin-bottom: 16px;
    line-height: 1.6;
    font-size: 13px;

  .skill-lv-tabs { display: flex; flex-direction: column; gap: 8px; }

  .skill-lv-tab {
    padding: 12px 14px;
    background: rgba(212, 168, 67, 0.05);
    border: 1px solid rgba(212, 168, 67, 0.3);
    border-radius: 6px;

  }

  .skill-lv-tab:hover {

  .lv-header { font-weight: 600; color: var(--gold-light); margin-bottom: 4px; }
  .lv-location { font-size: 12px; color: var(--text-dim); }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }

  /* ===== Home / Changelog ===== */
  .home-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .version-pill {
    background: rgba(212, 168, 67, 0.1);
    border: 1px solid rgba(212, 168, 67, 0.35);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 13px;

    padding: 6px 14px;
    border-radius: 20px;

    flex-shrink: 0;
  }

  .version-date {
    color: var(--text-dim);

  .home-two-col {

    grid-template-columns: 1fr 1fr;

  @media (max-width: 700px) {

  .home-section {
    background: rgba(15, 23, 42, 0.5);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid rgba(51, 65, 85, 0.6);
  }

  .home-section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .upcoming-header { color: var(--accent); }
  .recent-header   { color: #77D77B; }

  .upcoming-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .upcoming-item {
    font-size: 13px;
    color: var(--text-dim);

    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    display: inline-block;
    width: fit-content;
    letter-spacing: 0.3px;
  }

  .status-soon    { background: rgba(63,200,249,0.12); color: var(--accent); border: 1px solid rgba(63,200,249,0.3); }
  .status-wip     { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
  .status-planned { background: rgba(100,116,139,0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }

  .changelog-card {
    background: rgba(30, 41, 59, 0.8);
    padding: 32px;
    border-radius: 8px;
    border: 1px solid rgba(51, 65, 85, 0.8);
  }

  .changelog-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 22px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .changelog-subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .changelog-divider {
    border: none;
    border-top: 1px solid rgba(51, 65, 85, 0.6);
    margin: 28px 0;
  }

  .patch-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .patch-item {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .patch-item-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
    letter-spacing: 0.4px;
  }

  .tag-new    { background: rgba(119, 215, 123, 0.15); color: #77D77B; border: 1px solid rgba(119,215,123,0.3); }
  .tag-fix    { background: rgba(255, 188, 66, 0.15); color: #ffbc42; border: 1px solid rgba(255,188,66,0.3); }
  .tag-update { background: rgba(63, 200, 249, 0.15); color: var(--accent); border: 1px solid rgba(63,200,249,0.3); }
  .tag-wip    { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }
</style>
</head>

<body>
<div id="stars"></div>

<div id="sb-root"></div>
<script>
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      const root = document.getElementById('sb-root');
      root.innerHTML = html;
      root.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
      // ผูก event ให้ปุ่มอาชีพใน sidebar โหลด job data แทนการ navigate
      root.querySelectorAll('.sb-job-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const url = new URL(this.href, location.href);
          const jobId = url.searchParams.get('job');
          if (jobId && location.pathname.includes('index')) {
            e.preventDefault();
            renderJob(jobId);
            document.body.classList.remove('sidebar-open');
          }
        });
      });
    })
    .catch(() => console.warn('ไม่สามารถโหลด sidebar.html ได้'));
</script>

<!-- Main Content -->
<div class="hero">
  <h1 class="hero-title">🐺 Iruna Online</h1>
  <p class="hero-desc">ห้องสมุดแห่งอาชีพ | บทความข้อมูลภาษาไทย</p>

<script>
  const JOB_DATA_PATH = './data/jobs/';
  const jobFilesMap = {
    'Summoner': 'summoner.json',
    'Paladin': 'paladin.json',
    'Gladiator': 'gladiator.json',
    'Beast Knight': 'beastknight.json',
    'Sniper': 'sniper.json',
    'Assassin': 'assassin.json',
    'High Wizard': 'highwizard.json',
    'Necromancer': 'necromancer.json',
    'Enchanter': 'enchanter.json',
    'Bishop': 'bishop.json',
    'Monk': 'monk.json',
    'Servant': 'servant.json',
    'Ninja': 'ninja.json',
    'Samurai': 'samurai.json',
    'Minstrel': 'minstrel.json',
    'Alchemist': 'alchemist.json'
  };

  // ===== Sidebar Toggle (ใช้ร่วมกับ sidebar.html) =====
  function closeSidebar() {
    document.body.classList.remove('sidebar-open');
  }

  // ปิด sidebar เมื่อกด ESC
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSidebar();
  });

  // ===== Load Job Data =====
  async function loadJobData(jobId) {
    try {
      const fileName = jobFilesMap[jobId];
      if (!fileName) return null;
      const response = await fetch(`${JOB_DATA_PATH}${fileName}`);
      if (!response.ok) return null;
      return await response.json();
    } catch (error) {
      console.error(`เกิดข้อผิดพลาด: ${error}`);
      return null;
    }
  }

  // ===== Changelog Data =====
  const SITE_VERSION_DATE = '22 พ.ค. 2025';

  const RECENT_UPDATES = [
    { tag: 'update', text: 'เพิ่มข้อมูลEXP จากเควส EP6 ล่าสุด' },
    { tag: 'new',    text: 'เพิ่มหน้าเส้นทางอาชีพ' },
    { tag: 'fix',    text: 'แก้ไขการแสดงผลฟังชันสุุ่มอาชีพ' },
    { tag: 'update', text: 'อัปเดตเมนูให้ใช้ง่ายขึ้น' },
    { tag: 'new',    text: 'เพิ่มหน้าแสดงEXPจากเควส' },
    { tag: 'fix',    text: 'แก้ไขการคำนวนEXP โหมด1,โหมด2' },
    { tag: 'update', text: 'เพิ่มข้อมูลEXP จากเควส EP5' },
    { tag: 'update', text: 'เพิ่มข้อมูลEXP จากเควส EP2 - EP4' },
    { tag: 'new',    text: 'เพิ่มหน้าฟังก์ชันคำนวนEXPจากเควส' },
  ];

  const UPCOMING = [
    { status: 'soon',    text: 'ข้อมูลสกิลอาชีพพาลาดิน' },
    { status: 'planned', text: 'ข้อมูลสกิลอาชีพที่เหลือ (จอมขมังเวทย์, นักดนตรี, สังฆราช ฯลฯ)' },
    { status: 'planned', text: 'เครื่องมือเช็คลิสสกิลทุกอาชีพ' },
    { status: 'planned', text: 'หน้าแยกแสดงวิธีทำสกิลอย่างละเอียด' },
    { status: 'planned', text: 'ไกด์ทุกอาชีพ' },
    { status: 'planned', text: 'ระบบคำนวนสเตตัส' },
  ];

  const tagLabel = { new: 'NEW', fix: 'FIX', update: 'UPDATE', wip: 'WIP' };
  const tagClass  = { new: 'tag-new', fix: 'tag-fix', update: 'tag-update', wip: 'tag-wip' };
  const statusLabel = { soon: '🔜 เร็ว ๆ นี้', wip: '🔨 กำลังทำ', planned: '📌 วางแผนไว้' };
  const statusClass = { soon: 'status-soon', wip: 'status-wip', planned: 'status-planned' };

  function renderChangelog() {
    const viewport = document.getElementById('view-port');
    document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));

    const upcomingHTML = UPCOMING.map(item => `
      <li class="upcoming-item">
        <span class="status-badge ${statusClass[item.status]}">${statusLabel[item.status]}</span>
        <span>${item.text}</span>
      </li>
    `).join('');

    const recentHTML = RECENT_UPDATES.map(item => `
      <li class="patch-item">
        <span class="patch-item-tag ${tagClass[item.tag]}">${tagLabel[item.tag]}</span>
        <span>${item.text}</span>
      </li>
    `).join('');

    viewport.innerHTML = `
      <div class="changelog-card">
        <div class="home-header">
          <div>
            <h2 class="changelog-title">ข้อมูลอัพเดตเว็บไซต์</h2>
            <p class="changelog-subtitle">ห้องสมุด Iruna Online ภาษาไทย</p>
          </div>
          <div class="version-pill">${SITE_VERSION_DATE}</div>
        </div>

        <hr class="changelog-divider">

        <div class ="home-section">
            <div class="home-section-header recent-header">
              <span>✅ อัปเดตล่าสุด</span>
            </div>
            <ul class="patch-items">${recentHTML}</ul>
          </div>
        </div>

        <div class="home-two-col">
          <div class="home-section">
            <div class="home-section-header upcoming-header">
              <span>กำลังจะมา</span>
              <span class="version-date">soon</span>
            </div>
            <ul class="upcoming-list">${upcomingHTML}</ul>
          </div>

        <hr class="changelog-divider">
        <p style="font-size: 12px; color: var(--text-dim); text-align: center;">
          หากพบปัญหาหรือมีข้อเสนอแนะ สามารถติดต่อได้ที่ 
          <a href="https://discord.gg/SKDeYngNp" target="_blank" style="color: var(--accent); text-decoration: underline;">Discord Server</a> ของเรา
        </p>
      </div>
    `;
  }

  async function renderJob(jobId) {
    const viewport = document.getElementById('view-port');
    viewport.innerHTML = '<div class="card"><div class="loading">⏳ กำลังโหลดข้อมูล...</div></div>';
    
    const job = await loadJobData(jobId);
    if (!job) {
      viewport.innerHTML = '<div class="card"><div class="loading">❌ ไม่สามารถโหลดข้อมูลได้</div></div>';
      return;
    }

    document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`[data-job="${jobId}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    let skillsHTML = '';
    if (job.skills && job.skills.length > 0) {
      skillsHTML = '<div class="skills-grid">' +
        [...job.skills]
        .sort((a, b) => {
          if (!a.image && b.image) return -1;
          if (a.image && !b.image) return 1;
          return 0;
        })
        .map(s => {
          const skillNameEsc = s.name.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillTypeEsc = s.type.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillDescEsc = s.desc.replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillLvEsc   = (s.lv || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillLocEsc  = (s.loc || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          const skillImgEsc  = (s.image || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
          return `
            <button class="skill-btn" onclick="openSkillDetailModal('${skillNameEsc}', '${skillTypeEsc}', '${skillDescEsc}', '${skillLvEsc}', '${skillLocEsc}', '${skillImgEsc}')">
              ${s.image ? `<img src="${s.image}">` : '🅿️'}
              <span>${s.name}</span>
            </button>
          `;
        }).join('') +
      '</div>';
    }

    viewport.innerHTML = `
      <div class="card">
        <h1 class="job-title">${job.name}</h1>
        <p class="job-desc">${job.desc}</p>
        ${skillsHTML ? `<div class="section-title">⚔️ ข้อมูลสกิล</div><div>${skillsHTML}</div>` :
          '<div class="section-title">⚔️ สกิล</div><div class="info-box">ยังไม่มีข้อมูลสกิลในฐานข้อมูล</div>'}
        <div class="section-title">✓ คำแนะนำสำหรับอาชีพ</div>
        <div class="info-box">
          ${job.prereq.map(r => `<div class="req-item">• ${r}</div>`).join("")}
        </div>
      </div>
    `;
  }

  function openSkillDetailModal(skillName, skillType, skillDesc, skillLv, skillLoc, skillImage) {
    const modal  = document.getElementById('skillModal');
    const header = document.getElementById('modalHeader');
    const body   = document.getElementById('modalBody');

    const lvArray  = skillLv  ? skillLv.split(',')  : [];
    const locArray = skillLoc ? skillLoc.split(',') : [];

    let lvTabsHTML = '';
    if (lvArray.length > 0) {
      lvTabsHTML = '<div class="skill-lv-tabs">' +
        lvArray.map((lv, idx) => {
          const locInfo = locArray[idx] ? locArray[idx].trim() : 'รอการอัปเดต';
          return `
            <div class="skill-lv-tab">
              <div class="lv-header">📍 Level ${idx + 1}</div>
              <div>เลเวลตัวละคร: <strong>${lv.trim()}</strong></div>
              <div class="lv-location">${locInfo}</div>
            </div>
          `;
        }).join('') +
      '</div>';
    }

    header.innerHTML = `
      <div>
        ${skillImage ? `<img src="${skillImage}" style="width:36px;vertical-align:middle;margin-right:8px;border-radius:4px;">` : ''}
        ${skillName}
      </div>
      <button class="close-modal" onclick="document.getElementById('skillModal').close()">✕</button>
    `;

    body.innerHTML = `
      <div class="skill-detail-type">${skillType}</div>
      <div class="skill-detail-desc">${skillDesc}</div>
      ${lvTabsHTML ? `<div style="margin-bottom: 8px; font-weight: 600; color: var(--gold);">วิธีการรับสกิล</div>${lvTabsHTML}` : ''}
    `;

    modal.showModal();
  }

  document.addEventListener('DOMContentLoaded', function() {
    renderChangelog();

    // รับ ?job= param จาก URL (เมื่อมาจากหน้าอื่นผ่าน sidebar link)
    const params = new URLSearchParams(location.search);
    const jobParam = params.get('job');
    if (jobParam) renderJob(jobParam);
  });
</script>
</body>
</html>
