<style>

    --deep: #0a0812; --text: #e8e0f0; --text-dim: #9d8fb8;

  /* ── Sidebar (unchanged) ── */

  .sidebar-open .sb-overlay { opacity: 1; pointer-events: all; }
  .sidebar { position: fixed; top: 0; left: 0; z-index: 1000; width: var(--sidebar-width); height: 100vh; background: rgba(12,10,22,0.97); border-right: 1px solid rgba(212,168,67,0.2); display: flex; flex-direction: column; gap: 5px; padding: 70px 12px 40px; overflow-y: auto; transform: translateX(calc(-1 * var(--sidebar-width))); transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: none; }

  .sb-btn { display: block; width: 100%; text-align: left; padding: 9px 12px; background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.6); border-radius: 6px; color: var(--text-dim); font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; cursor: pointer; text-decoration: none; transition: all .2s; }
  .sb-btn:hover { background: rgba(63,200,249,0.08); border-color: var(--accent); color: var(--accent); }
  .sb-btn.active { background: rgba(212,168,67,0.1); border-color: var(--gold); color: var(--gold-light); }
  .sb-section-label { margin-top: 10px; font-size: 11px; color: var(--gold); letter-spacing: 1px; padding: 6px 0 4px; border-bottom: 1px solid rgba(212,168,67,0.2); }

  /* ── Hero ── */
  .hero { text-align: center; padding: 56px 20px 32px; position: relative; z-index: 1; }
  .hero-title { font-family: 'Cinzel Decorative', serif; font-size: clamp(20px, 5vw, 32px); background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }

  /* ── Main ── */

  /* ── Job header card ── */

    border-radius: 12px; padding: 24px 28px; margin-bottom: 10px;
  }

 /* ── Filter system ── */

}
.filter-toggle-btn:hover { background: rgba(212,168,67,0.16); }
.filter-toggle-btn.open  { background: rgba(212,168,67,0.16); border-color: var(--gold); }

.filter-panel {
  background: rgba(15,20,35,0.9); border: 1px solid rgba(51,65,85,0.7);
  border-radius: 10px; padding: 16px; margin-bottom: 16px;
  display: none; flex-direction: column; gap: 14px;
}
.filter-panel.open { display: flex; }

.filter-group-label {
  font-size: 11px; font-weight: 700; color: var(--gold);
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 6px;
}
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.chip {

}

.filter-reset:hover { border-color: #ff8080; color: #ff8080; }

.filter-result-count {
  font-size: 12px; color: var(--text-dim); margin-bottom: 8px;
}
  /* ── Skill card (list layout) ── */

  /* ── Type tags ── */

  .skill-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 10px; }

div.skill-lv-row {

  .lv-badge { font-size: 11px; font-weight: 700; color: var(--deep); background: var(--gold); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }

  /* ── Section title ── */
  .section-title { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: .8px; text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(212,168,67,0.18); }

  /* ── back button ── */
  .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; padding: 9px 20px; background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.3); border-radius: 8px; color: var(--gold); text-decoration: none; font-size: 14px; transition: all .2s; }

    .job-header-card { padding: 18px 16px; }

    color: var(--accent); cursor: pointer;

  .npc-overlay {
    position: fixed; inset: 0; z-index: 9999;

  .npc-popup {
    background: rgba(12,10,22,0.97); border: 1px solid rgba(212,168,67,0.3);
    border-radius: 14px; padding: 20px 22px;
    max-width: 400px; width: 92%; position: relative;
  }
  .npc-popup-header {
    display: flex; justify-content: space-between;

  }
  .npc-popup-title { font-size: 15px; font-weight: 700; color: var(--gold-light); }
  .npc-popup-close {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 20px; line-height: 1;
    padding: 2px 6px; border-radius: 6px; transition: color .2s;
  }
  .npc-popup-close:hover { color: var(--text); }
  .npc-popup-img-wrap {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);

  }
  .npc-popup-img-wrap img { width: 100%; display: block; border-radius: 10px; }
  .npc-popup-loading { font-size: 13px; color: var(--text-dim); padding: 2rem; text-align: center; }
  .npc-popup-error { font-size: 13px; color: #ff8080; padding: 1.5rem; text-align: center; }
  .npc-popup-info { margin-top: 10px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
</style>

<div id="sb-root"></div>
<script>
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      const root = document.getElementById('sb-root');
      root.innerHTML = html;
      root.querySelectorAll('script').forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns);
      });
    })
    .catch(() => {});
</script>

<div class="hero">
  <h1 class="hero-title" id="page-title">ข้อมูลอาชีพ</h1>
  <p class="hero-desc" id="page-desc"></p>
</div>

<div class="main-wrapper">
  <div id="view-port">

<script>
const JOB_DATA_PATH   = './data/jobs/';
const SKILLS_DATA_PATH = './data/skills.json';

/* cache skills master data (โหลดครั้งเดียว) */
let _skillsMaster = null;
async function getSkillsMaster() {
  if (_skillsMaster) return _skillsMaster;
  try {
    const r = await fetch(SKILLS_DATA_PATH);
    if (r.ok) _skillsMaster = await r.json();
  } catch(e) {}
  return _skillsMaster || {};
}

/* merge: รับ skills array จาก job file + master map
   คืน array พร้อม name/desc/type/image/summonSkills ครบ */
function mergeSkills(jobSkills, master) {
  return jobSkills.map(s => {
    const m = master[s.skillId] || {};
    return {
      skillId:     s.skillId,
      name:        m.name        || s.skillId,
      type:        m.type        || [],
      desc:        m.desc        || '',
      image:       m.image       || null,
      summonSkills:m.summonSkills|| null,
      lv:          s.lv,
      obtain:      s.obtain,
      loc:         s.loc,
    };
  });
}

/* ── jobFilesMap: ครบทุกอาชีพ รวมอาชีพย่อย ── */
const jobFilesMap = {
  /* ── Lv.1 ── */

  /* ── สายนักรบ ── */

  'apprentice_knight':  { file: 'apprentice_knight.json',  label: 'อัศวินฝึกหัด' },
  'knight':             { file: 'knight.json',             label: 'อัศวิน' },

  'apprentice_paladin':     { file: 'apprentice_paladin.json',     label: 'พาลาดินฝึกหัด' },
  'paladin':                { file: 'paladin.json',                label: 'พาลาดิน' },
  'apprentice_gladiator':   { file: 'apprentice_gladiator.json',   label: 'จอมดาบฝึกหัด' },
  'gladiator':              { file: 'gladiator.json',              label: 'จอมดาบ' },
  'apprentice_beastknight':{ file: 'apprentice_beastknight.json', label: 'บีทไนท์ฝึกหัด' },
  'beastknight':           { file: 'beastknight.json',           label: 'บีทไนท์' },

  /* ── สายนายพราน ── */
  'apprentice_hunter': { file: 'apprentice_hunter.json', label: 'นายพรานฝึกหัด' },
  'hunter':            { file: 'hunter.json',            label: 'นายพราน' },

  'apprentice_assassin': { file: 'apprentice_assassin.json', label: 'นักฆ่าฝึกหัด' },
  'assassin':            { file: 'assassin.json',            label: 'นักฆ่า' },
  'apprentice_sniper':   { file: 'apprentice_sniper.json',   label: 'นักแม่นฝึกหัด' },
  'sniper':              { file: 'sniper.json',              label: 'นักแม่น' },
  'apprentice_summoner': { file: 'apprentice_summoner.json', label: 'ซัมมอนเนอร์ฝึกหัด' },
  'summoner':            { file: 'summoner.json',            label: 'ซัมมอนเนอร์' },

  /* ── สายเวทย์ ── */
  'apprentice_mage': { file: 'apprentice_mage.json', label: 'นักเวทย์ฝึกหัด' },

function tagClass(type) {
  if (!type) return 'tag-default';
  const t = type.toLowerCase();
  if (t.includes('passive') || t.includes('สกิลติดตัว')) return 'tag-passive';
  if (t.includes('summon')  || t.includes('อัญเชิญ'))   return 'tag-summon';
  if (t.includes('heal')    || t.includes('ฮีล'))        return 'tag-heal';
  if (t.includes('buff')    || t.includes('บัฟ'))        return 'tag-buff';
  if (t.includes('debuff')  || t.includes('ดีบัฟ'))      return 'tag-debuff';
  if (t.includes('active')  || t.includes('สกิลกดใช้'))  return 'tag-active';
  if (t.includes('special') || t.includes('พิเศษ'))      return 'tag-special';
  return 'tag-default';
}


function normalizeTypes(type) {
  if (!type) return [];
  if (Array.isArray(type)) return type.map(t => t.trim()).filter(Boolean);
  return type.split(',').map(t => t.trim()).filter(Boolean);
}
function buildTagHTML(type) {
  return normalizeTypes(type)
    .map(t => `<span class="tag ${tagClass(t)}">${t}</span>`)
    .join('');
}

// ── NPC id map: ชื่อ NPC
let NPC_ID_MAP = {};
const NPC_BASE = './data/npc/';

// โหลดข้อมูลจากไฟล์ JSON
fetch('./NPC/npc_id_map.json')
  .then(res => res.json())
  .then(data => {
     NPC_ID_MAP = data;
  });

function renderLoc(locString) {
  if (!locString) return 'รอการอัปเดต';
  return locString.split(',').map(part => {
    part = part.trim();
    /* จับชื่อ NPC จากรูปแบบ "...กับXXX ที่YYY" หรือ "...กับXXX YYY" */
    const m = part.match(/กับ([^\s,]+(?:\s[^\s,]+)?)/);
    if (m) {
      const npcName = m[1].trim();
      const npcId = NPC_ID_MAP[npcName];
      if (npcId) {
        const label = part.replace(/.*กับ/, '').trim();
        return `<span class="npc-link" onclick="showNpcPopup('${npcId}','${label.replace(/'/g,"\\'")}')">📍 ${label}</span>`;
      }
    }
    return `<span>${part}</span>`;
  }).join(' &nbsp;·&nbsp; ');
}

/* ── level rows ── */
function buildLevels(lv, loc, obtainArr, skillId) {
  const lvArr     = lv  ? lv.split(',')  : [];
  const locArr    = loc ? loc.split(',') : [];
  const obtainList = Array.isArray(obtainArr) ? obtainArr : [];
  if (!lvArr.length) return '';
  const activeObtain = filterState.obtain;
  const activeLevel  = filterState.level;
  const rows = lvArr.map((l, i) => {
    const rowObtain = obtainList[i] ? obtainList[i].trim() : '';
    if (activeObtain !== 'all' && rowObtain !== activeObtain) return '';
    /* filter by level band */
    if (activeLevel !== 'all') {
      const n = parseInt(l.trim());
      let band = null;
      if (!isNaN(n)) {
        if (n <= 10)       band = '10';
        else if (n <= 20)  band = '20';
        else if (n <= 50)  band = '50';
        else if (n <= 120) band = '70–120';
        else               band = '140+';
      }
      if (band !== activeLevel) return '';
    }
    const locRaw = locArr[i] ? locArr[i].trim() : '';
    const locInfo = renderLoc(locRaw);
    const skillLv = i + 1;       /* สกิล Lv (1-based) */
    const charLv  = l.trim();    /* ตัวละคร Lv */
    // ── ตรวจสอบเงื่อนไขการกด (เควส, ไอเทมดรอป, ไอเทมซื้อร้านค้า) ──
    const clickableTypes = ['เควส', 'ไอเทมดรอป', 'ไอเทมซื้อร้านค้า'];
    const isClickable = clickableTypes.includes(rowObtain);
    if (isClickable) {
      const url = `obtain.html?skill=${encodeURIComponent(skillId)}&lv=${skillLv}&clv=${encodeURIComponent(charLv)}&type=${encodeURIComponent(rowObtain)}`;
      return `<a href="${url}" target="_blank" class="skill-lv-row clickable" title="คลิกเพื่อดูลายละเอียดวิธีการได้สกิลนี้">
        <span class="lv-badge">Lv.${skillLv}</span>
        <span class="lv-loc">ตัวละคร Lv.${charLv} &nbsp;·&nbsp; ${locInfo}</span>
      </a>`;
    } else {
      return `<div class="skill-lv-row">
        <span class="lv-badge">Lv.${skillLv}</span>
        <span class="lv-loc">ตัวละคร Lv.${charLv} &nbsp;·&nbsp; ${locInfo}</span>
      </div>`;
    }
  }).join('');
  return rows ? `<div class="skill-levels">${rows}</div>` : '';
}

function buildSummonBlock(summonSkills) {
  if (!summonSkills || summonSkills.length === 0) return '';
  const rows = summonSkills.map(ss => `
    <div class="summon-skill-row">
      ${ss.image
        ? `<img class="summon-skill-icon" src="${ss.image}" alt="">`
        : `<div class="summon-skill-icon" style="background:rgba(180,130,255,0.1);border:1px solid rgba(180,130,255,0.2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;">✦</div>`}
      <div class="summon-skill-info">
        <div class="summon-skill-name">
          ${ss.name}
          ${ss.type ? ` <span class="tag ${tagClass(ss.type)}" style="font-size:10px;">${ss.type}</span>` : ''}
          ${ss.req ? ` <span style="font-size:10px;color:#ffc850;border:1px solid rgba(255,200,80,0.4);background:rgba(255,200,80,0.08);border-radius:8px;padding:1px 7px;">⚠ ${ss.req}</span>` : ''}
        </div>
        ${ss.desc ? `<div class="summon-skill-desc">${ss.desc}</div>` : ''}
      </div>
    </div>`).join('');
  return `<div class="summon-block">
    <div class="summon-block-title">✦ สกิลของตัวอัญเชิญ</div>
    <div class="summon-skills">${rows}</div>
  </div>`;
}

/* ── build skill card ── */
function buildSkillCard(s) {
  const types = normalizeTypes(s.type);       
  const typeStr = types.join(',').toLowerCase();
  const isSummon = typeStr.includes('summon') || typeStr.includes('อัญเชิญ');
  const bands    = getLevelBands(s.lv).join(',');
  const obtain = Array.isArray(s.obtain)
    ? s.obtain.join(',')
    : (s.obtain ? s.obtain.trim() : '');

  return `<div class="skill-card" data-types="${typeStr}" data-levels="${bands}" data-obtain="${obtain}">
    <div class="skill-card-header">
      ${s.image
        ? `<img class="skill-icon" src="${s.image}" alt="">`
        : `<div class="skill-icon-placeholder">P</div>`}
      <div class="skill-name-wrap">
        <div class="skill-name">${s.name}</div>
        <div class="skill-tags">${buildTagHTML(s.type)}</div>
      </div>
    </div>
    ${s.desc ? `<div class="skill-desc">${s.desc}</div>` : ''}
    ${s.loc && !s.lv ? `<div class="skill-desc" style="font-size:12px;margin-bottom:0;">📍 ${renderLoc(s.loc)}</div>` : ''}
    ${buildLevels(s.lv, s.loc, s.obtain, s.skillId)}
    ${isSummon && s.summonSkills ? buildSummonBlock(s.summonSkills) : ''}
  </div>`;
}

/* ── filter system ── */
let filterState = { type: 'all', level: 'all', obtain: 'all' };
function getLevelBands(lvString) {
  if (!lvString) return [];
  return [...new Set(
    lvString.split(',').map(l => {
      const n = parseInt(l.trim());
      if (isNaN(n)) return null;
      if (n <= 10)  return '10';
      if (n <= 20)  return '20';
      if (n <= 50)  return '50';
      if (n <= 120) return '70–120';
      return '140+';
    }).filter(Boolean)
  )];
}
function applyFilters() {
  const cards = document.querySelectorAll('.skill-card');
  let visible = 0;
  cards.forEach((card, idx) => {
    const matchType   = filterState.type   === 'all' || card.dataset.types.includes(filterState.type.toLowerCase());
    const matchLevel  = filterState.level  === 'all' || card.dataset.levels.includes(filterState.level);
    const matchObtain = filterState.obtain === 'all' || card.dataset.obtain.includes(filterState.obtain);
    const show = matchType && matchLevel && matchObtain;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
    /* re-render level rows to match obtain & level filter */
    if (window._jobSkills && window._jobSkills[idx]) {
      const s = window._jobSkills[idx];
      const levelsEl = card.querySelector('.skill-levels');
      const newLevels = buildLevels(s.lv, s.loc, s.obtain, s.skillId);
      if (levelsEl) {
        levelsEl.outerHTML = newLevels || '<div class="skill-levels"></div>';
      } else if (newLevels) {
        const descEl = card.querySelector('.skill-desc');
        if (descEl) descEl.insertAdjacentHTML('afterend', newLevels);
      }
    }
  });
  const counter = document.getElementById('filter-result-count');
  if (counter) counter.textContent = `แสดง ${visible} จาก ${cards.length} สกิล`;
}

function setupFilters(skills) {
  /* collect unique values */
  const types   = new Set();
  const levels  = new Set();
  const obtains = new Set();
  skills.forEach(s => {
    normalizeTypes(s.type).forEach(t => types.add(t));
    const bands = getLevelBands(s.lv);
    bands.forEach(b => levels.add(b));
    if (s.obtain) {
      const vals = Array.isArray(s.obtain) ? s.obtain : [s.obtain];
      vals.forEach(v => obtains.add(v.trim()));
    }
  });
  const bar = document.getElementById('filter-bar');
  if (!bar) return;
  /* ── type chip color hint ── */
  function typeColor(t) {
    const tl = t.toLowerCase();
    if (tl.includes('summon') || tl.includes('อัญเชิญ'))  return 'summon';
    if (tl.includes('passive')|| tl.includes('สกิลติดตัว'))return 'passive';
    if (tl.includes('buff')   || tl.includes('บัฟ'))       return 'buff';
    if (tl.includes('heal')   || tl.includes('ฮีล'))       return 'heal';
    if (tl.includes('debuff') || tl.includes('ดีบัฟ'))     return 'debuff';
    return 'active';
  }
  /* ── level band order ── */
  const bandOrder = [...levels].sort((a, b) => parseInt(a) - parseInt(b));
  bar.innerHTML = `
    <button class="filter-toggle-btn" id="filter-toggle-btn">
      ⚙ ตัวกรอง <span id="filter-active-dot" style="display:none;width:7px;height:7px;border-radius:50%;background:#f0c96a;display:inline-block;"></span>
    </button>

    <div class="filter-panel" id="filter-panel">

      <div>
        <div class="filter-group-label">ประเภทความสามารถ</div>
        <div class="filter-chips" id="chips-type">
          <button class="chip active" data-group="type" data-val="all">ทั้งหมด</button>
          ${[...types].map(t =>
            `<button class="chip" data-group="type" data-val="${t}" data-color="${typeColor(t)}">${t}</button>`
          ).join('')}
        </div>
      </div>

      <div>
        <div class="filter-group-label">ช่วงเลเวล</div>
        <div class="filter-chips" id="chips-level">
          <button class="chip active" data-group="level" data-val="all">ทั้งหมด</button>
          ${bandOrder.map(b =>
            `<button class="chip" data-group="level" data-val="${b}">Lv.${b}</button>`
          ).join('')}
        </div>
      </div>

      <div>
        <div class="filter-group-label">วิธีได้รับสกิล</div>
        <div class="filter-chips" id="chips-obtain">
          <button class="chip active" data-group="obtain" data-val="all">ทั้งหมด</button>
          <button class="chip" data-group="obtain" data-val="เปลี่ยนอาชีพ" data-color="obtain">เปลี่ยนอาชีพ</button>
          <button class="chip" data-group="obtain" data-val="เควส" data-color="obtain">เควส</button>
          <button class="chip" data-group="obtain" data-val="ไอเทมดรอป" data-color="obtain">ไอเทมดรอป</button>
          <button class="chip" data-group="obtain" data-val="ไอเทมซื้อร้านค้า" data-color="obtain">ไอเทมซื้อร้านค้า</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,0.06);padding-top:10px;">
        <button class="filter-reset" id="filter-reset-btn">↺ รีเซ็ตทั้งหมด</button>
        <span class="filter-result-count" id="filter-result-count"></span>
      </div>
    </div>
  `;
  /* toggle open/close */
  document.getElementById('filter-toggle-btn').addEventListener('click', () => {
    const panel = document.getElementById('filter-panel');
    const btn   = document.getElementById('filter-toggle-btn');
    panel.classList.toggle('open');
    btn.classList.toggle('open');
  });
  /* chip click */
  bar.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const group = chip.dataset.group;
    const val   = chip.dataset.val;
    /* deactivate siblings */
    bar.querySelectorAll(`.chip[data-group="${group}"]`).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    filterState[group] = val;
    /* dot indicator */
    const isDefault = filterState.type === 'all' && filterState.level === 'all' && filterState.obtain === 'all';
    const dot = document.getElementById('filter-active-dot');
    if (dot) dot.style.display = isDefault ? 'none' : 'inline-block';

    applyFilters();
  });
  /* reset */
  document.getElementById('filter-reset-btn').addEventListener('click', () => {
    filterState = { type: 'all', level: 'all', obtain: 'all' };
    bar.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.dataset.val === 'all');
    });
    const dot = document.getElementById('filter-active-dot');
    if (dot) dot.style.display = 'none';
    applyFilters();
  });

  applyFilters();
}

/* ── parse [label](npcId) in obtain text ── */
function parseObtainText(text) {
  if (!text) return text;
  return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, npcId) => {
    return `<span class="npc-link" onclick="showNpcPopup('${npcId}','${label.replace(/'/g,"\\'")}')">${label}</span>`;
  });
}

/* ── fetch & render ── */
async function renderJob(jobId) {
  const vp = document.getElementById("view-port");
  const matchedKey = Object.keys(jobFilesMap).find(k => k.toLowerCase() === jobId.toLowerCase());
  const entry = matchedKey ? jobFilesMap[matchedKey] : null;




  if (!entry) {
    document.getElementById('page-title').textContent = 'ไม่พบอาชีพ';
    vp.innerHTML = `<div class="not-found">
      <div class="not-found-icon">🔍</div>
      <h2>ไม่พบข้อมูลอาชีพ "${jobId}"</h2>
      <p>อาชีพนี้ยังไม่มีในฐานข้อมูล หรืออาจสะกดผิด</p>
      <a href="job_tree" class="back-btn">← กลับไปเส้นทางอาชีพ</a>
    </div>`;
    return;
  }

  document.getElementById('page-title').textContent = entry.label;
  vp.innerHTML = '<div class="loading">⏳ กำลังโหลดข้อมูล...</div>';

  let job = null;
  try {
    const r = await fetch(`${JOB_DATA_PATH}${entry.file}`);
    if (r.ok) job = await r.json();
  } catch(e) {}

  if (!job) {
    vp.innerHTML = `<div class="job-header-card">
      <div class="job-name">${entry.label}</div>
      <div class="job-desc">ยังไม่มีข้อมูลอาชีพนี้ในฐานข้อมูล กรุณารอการอัปเดต</div>
      <a href="job_tree" class="back-btn">← กลับไปเส้นทางอาชีพ</a>
    </div>`;
    return;
  }

  document.getElementById('page-title').textContent = job.name || entry.label;

  /* prereq meta pills */
  const metaHTML = (job.prereq || []).map(r => `<span class="job-meta-item">${r}</span>`).join('');

  /* obtain HTML — support inline <a> tags */
  const obtainHTML = job.obtain
    ? `<div class="job-obtain"><span class="job-obtain-label">วิธีเปลี่ยนอาชีพ</span>${parseObtainText(job.obtain)}</div>`
    : '';

  /* โหลด skills master แล้ว merge กับ job skills */
  const master = await getSkillsMaster();
  const skills = mergeSkills(job.skills || [], master);
  window._jobSkills = skills;
  const skillsHTML = skills.length
    ? `<div id="filter-bar" class="filter-bar"></div>
       <div class="skills-list">${skills.map(buildSkillCard).join('')}</div>`
    : `<div class="job-header-card" style="color:var(--text-dim);font-size:14px;">ยังไม่มีข้อมูลสกิล</div>`;

  vp.innerHTML = `
    <div class="job-header-card">
      <div class="job-name">${job.name || entry.label}</div>
      ${job.desc ? `<p class="job-desc">${job.desc}</p>` : ''}
      ${obtainHTML}
      ${metaHTML ? `<div class="job-meta">${metaHTML}</div>` : ''}
    </div>
    ${skills.length ? '<div class="section-title">⚔ สกิล</div>' : ''}
    ${skillsHTML}
    <a href="job_tree" class="back-btn">← กลับไปเส้นทางอาชีพ</a>
  `;

  if (skills.length) setupFilters(skills);
}

document.addEventListener('DOMContentLoaded', () => {
  const job = new URLSearchParams(location.search).get('job');
  if (job) {
    renderJob(job);

      <a href="job_tree" class="back-btn">← เส้นทางอาชีพ</a>

});

<script>
async function showNpcPopup(npcId, label) {
  document.getElementById('npcPopupTitle').textContent = label;
  document.getElementById('npcPopupInfo').textContent = '';
  const wrap = document.getElementById('npcPopupImgWrap');
  wrap.innerHTML = '<div class="npc-popup-loading">⏳ กำลังโหลด...</div>';
  document.getElementById('npcOverlay').classList.add('open');
  try {
    const res = await fetch(NPC_BASE + npcId + '.json');
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    let html = '';
    if (data.image) html += `<img src="${data.image}" alt="${label}" />`;
    else html = '<div class="npc-popup-loading" style="color:var(--text-dim)">ไม่มีรูปภาพ</div>';
    wrap.innerHTML = html;
    let info = '';
    if (data.location) info += '📍 ' + data.location;
    if (data.desc) info += (info ? '\n' : '') + data.desc;
    document.getElementById('npcPopupInfo').textContent = info;
  } catch {
    wrap.innerHTML = `<div class="npc-popup-error">⚠ ยังไม่มีข้อมูล NPC นี้<br><small style="opacity:.6">${npcId}.json</small></div>`;
  }
}
function closeNpcPopup() {
  document.getElementById('npcOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNpcPopup(); });
</script>
