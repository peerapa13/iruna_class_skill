<title>เส้นทางอาชีพ</title>
<meta name="robots" content="index, follow">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Thai:wght@300;400;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a843; --gold-light: #f0c96a; --accent: #3fc8f9;
    --deep: #0a0812; --text: #e8e0f0; --text-dim: #9d8fb8;
    --sidebar-width: 260px;
    --color-border-tertiary: rgba(255,255,255,0.08);
    --color-text-secondary: #9d8fb8;
    --font-sans: 'Noto Sans Thai', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--deep); color: var(--text); font-family: 'Noto Sans Thai', sans-serif; font-size: 15px; line-height: 1.6; }
  #stars { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.12) 0%, transparent 60%); }

  /* ── hamburger / sidebar ── */
  .hamburger-btn {
    position: fixed; top: 14px; left: 14px; z-index: 1001;
    width: 42px; height: 42px;
    background: rgba(10,8,18,0.9); border: 1px solid rgba(212,168,67,0.35);
    border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
    transition: border-color .2s, background .2s; backdrop-filter: blur(8px);
  }
  .hamburger-btn:hover { border-color: var(--gold); background: rgba(212,168,67,0.08); }
  .hamburger-btn span { display: block; width: 18px; height: 2px; background: var(--gold); border-radius: 2px; transition: transform .3s, opacity .3s; }
  .sidebar-open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .sidebar-open .hamburger-btn span:nth-child(2) { opacity: 0; }
  .sidebar-open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .sb-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sidebar-open .sb-overlay { opacity: 1; pointer-events: all; }
  .sidebar {
    position: fixed; top: 0; left: 0; z-index: 1000;
    width: var(--sidebar-width); height: 100vh;
    background: rgba(12,10,22,0.97); border-right: 1px solid rgba(212,168,67,0.2);
    display: flex; flex-direction: column; gap: 5px;
    padding: 70px 12px 40px; overflow-y: auto;
    transform: translateX(calc(-1 * var(--sidebar-width)));
    transition: transform .3s cubic-bezier(.4,0,.2,1); box-shadow: none;
  }
  .sidebar-open .sidebar { transform: translateX(0); box-shadow: 4px 0 32px rgba(0,0,0,0.6); }
  .sidebar-title { font-family: 'Cinzel Decorative', serif; font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid rgba(212,168,67,0.25); }
  .sb-btn { display: block; width: 100%; text-align: left; padding: 9px 12px; background: rgba(30,41,59,0.5); border: 1px solid rgba(51,65,85,0.6); border-radius: 6px; color: var(--text-dim); font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; cursor: pointer; text-decoration: none; transition: all .2s; }
  .sb-btn:hover  { background: rgba(63,200,249,0.08); border-color: var(--accent); color: var(--accent); }
  .sb-btn.active { background: rgba(212,168,67,0.1); border-color: var(--gold); color: var(--gold-light); }
  .sb-section-label { margin-top: 10px; font-size: 11px; color: var(--gold); letter-spacing: 1px; padding: 6px 0 4px; border-bottom: 1px solid rgba(212,168,67,0.2); }

  /* ── hero ── */
  .hero { text-align: center; padding: 60px 20px 32px; position: relative; z-index: 1; }
  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 6vw, 36px);
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 6px;
  }
  .hero-desc { color: var(--text-dim); font-size: clamp(13px, 3.5vw, 15px); }

  /* ── main wrapper ── */
  .main-wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 16px 80px; }

  /* ── tab bar ── */
  .wrap { font-family: 'Noto Sans Thai', sans-serif; padding: 0 0 12px; }
  .tab-bar { display: flex; gap: 8px; padding: 4px 0 16px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 18px; border-radius: 24px; border: 1.5px solid;
    font-size: clamp(13px, 3.5vw, 14px); font-weight: 600; cursor: pointer;
    background: transparent; transition: all .2s; font-family: inherit;
    min-height: 44px; /* tap target */
  }
  .tab-btn[data-tab="warrior"] { border-color: #3fc8f9; color: #3fc8f9; }
  .tab-btn[data-tab="warrior"].active { background: #3fc8f9; color: #042c53; }
  .tab-btn[data-tab="mage"] { border-color: #b482ff; color: #b482ff; }
  .tab-btn[data-tab="mage"].active { background: #b482ff; color: #26215c; }
  .tab-btn[data-tab="special"] { border-color: #ff80cc; color: #ff80cc; }
  .tab-btn[data-tab="special"].active { background: #ff80cc; color: #4b1528; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SVG scroll container ── */
  .svg-scroll {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 8px;
    /* ให้ user รู้ว่า scroll ได้ */
    background: linear-gradient(to right, transparent 95%, rgba(212,168,67,0.08));
  }
  .svg-scroll::-webkit-scrollbar { height: 4px; }
  .svg-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 2px; }
  .svg-scroll::-webkit-scrollbar-thumb { background: rgba(212,168,67,0.3); border-radius: 2px; }

  /* ── SVG wrapper สำหรับ overlay links ── */
  .svg-wrap { position: relative; display: block; min-width: 660px; }
  svg.tree { display: block; width: 100%; overflow: visible; }

  .nd { cursor: default; }
  .nd rect, .nd path { transition: filter .15s; }
  .nd text { pointer-events: none; font-family: 'Noto Sans Thai', sans-serif; }

  /* ── HTML overlay links ── */
  .job-link {
    position: absolute; display: flex; align-items: center; justify-content: center;
    text-decoration: none; border-radius: 7px; cursor: pointer;
    transition: filter .15s; font-family: 'Noto Sans Thai', sans-serif; font-size: 0;
  }
  .job-link:hover  { filter: brightness(1.8); }
  .job-link:active { filter: brightness(2.2); }


  /* ── scroll hint badge ── */
  .scroll-hint {
    display: none;
    font-size: 12px; color: var(--text-dim); text-align: right;
    margin-bottom: 6px; opacity: 0.75;
  }
  @media (max-width: 700px) { .scroll-hint { display: block; } }

  /* ── legend ── */
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--color-border-tertiary); }
  .lp { display: flex; align-items: center; gap: 6px; font-size: clamp(11px, 3vw, 12px); color: var(--color-text-secondary); }
  .ld { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .tree-hint { font-size: clamp(11px, 3vw, 12px); color: var(--text-dim); text-align: right; margin-bottom: 6px; opacity: 0.7; }
</style>

<div id="stars"></div>
<div id="sb-root"></div>
<script>
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      const root = document.getElementById('sb-root');
      root.innerHTML = html;
      root.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    })
    .catch(() => console.warn('ไม่สามารถโหลด sidebar.html ได้'));
</script>
